<title>Soru Takip · Eğitim Atölyesi</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--bg:#f3f7f4;--card:#fff;--ink:#1d2433;--mute:#6b7488;--line:#e2e8e4;--pri:#01953F;--blue:#018BD3;--ok:#01953F;--warn:#d98a00;--bad:#d64545}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px}
header{background:#fff;color:var(--ink);padding:10px 16px;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--pri);box-shadow:0 1px 6px #0000000d}
.marka{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.marka .klv{width:40px;height:40px}
.marka .yz{height:20px;display:block}
.marka .alt{font-size:13px;font-weight:700;color:var(--blue);margin-top:3px;letter-spacing:.3px}
.tv-body .marka .klv{width:56px;height:56px}.tv-body .marka .yz{height:28px}.tv-body .marka .alt{font-size:16px}
header a{color:var(--ink);font-size:14px;text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
main{padding:14px;max-width:1200px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.dar{max-width:560px;margin-left:auto;margin-right:auto}
h2{font-size:20px;margin:0 0 12px}h3{font-size:16px;margin:0 0 8px}
label{display:block;font-weight:600;margin:14px 0 6px}
input,select{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:#fff;color:var(--ink)}
.btn{display:inline-block;border:0;border-radius:10px;padding:12px 16px;font-size:16px;font-weight:600;cursor:pointer;background:var(--pri);color:#fff;text-decoration:none}
.btn.big{width:100%;padding:16px;font-size:18px;margin-top:16px}
.btn.ok{background:var(--ok)}.btn.warn{background:var(--warn)}.btn.bad{background:var(--bad)}.btn.gh{background:#eef1f7;color:var(--ink)}
.btn.sm{padding:7px 10px;font-size:14px}
.btn:disabled{opacity:.45}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:10px 15px;font-size:16px;cursor:pointer;color:var(--ink)}
.chip.on{border-color:var(--blue);background:#e6f4fb;color:#016a9f;font-weight:700}
.msg{padding:14px;border-radius:10px;margin-top:12px;font-weight:600}
.msg.ok{background:#e4f6ec;color:#11683a}.msg.bad{background:#fde8e8;color:#9b2020}.msg.info{background:#eef1f7}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.no{min-width:44px;text-align:center;font-weight:800;background:#eef1f7;border-radius:8px;padding:4px 6px}
.now{background:#fff6e0;border:1px solid #f1d38a;border-radius:10px;padding:10px;margin-bottom:8px}
.now .no{background:#ffe7a8}
.badge{background:#eef1f7;border-radius:999px;padding:2px 10px;font-size:13px;color:var(--mute);font-weight:400}
h3 .badge{float:right}
.mute{color:var(--mute);font-size:14px}
.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.big-no{font-size:44px;font-weight:800;line-height:1}
.yuk{opacity:.5;pointer-events:none}
.bekle{position:relative;color:transparent!important;pointer-events:none}
.bekle::after{content:"";position:absolute;inset:0;margin:auto;width:18px;height:18px;border:3px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:don .7s linear infinite}
.btn.gh.bekle::after{border-color:rgba(0,0,0,.15);border-top-color:#018BD3}
@keyframes don{to{transform:rotate(360deg)}}
#mesgul{position:fixed;top:0;left:0;height:3px;width:100%;background:linear-gradient(90deg,#01953F,#018BD3,#01953F);background-size:200% 100%;animation:akis 1s linear infinite;z-index:99;display:none}
#mesgul.on{display:block}
.nokta{display:inline-block;min-width:18px;height:18px;padding:0 5px;margin-left:2px;border-radius:9px;background:#dc2626;color:#fff;font:800 11px/18px Nunito,system-ui,sans-serif;font-style:normal;text-align:center;vertical-align:top}
.zil{margin-right:10px;text-decoration:none;font-size:20px;animation:zil 2.4s ease-in-out infinite;display:inline-block}
@keyframes zil{0%,86%,100%{transform:rotate(0)}89%{transform:rotate(14deg)}92%{transform:rotate(-12deg)}95%{transform:rotate(8deg)}}
.bb{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.bb:last-child{border-bottom:0}
#modal .chip.on{background:#01953F;color:#fff;border-color:#01953F}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#1f2937;color:#fff;border-radius:14px;padding:10px 12px 10px 16px;display:none;align-items:center;gap:12px;box-shadow:0 8px 24px #0004;z-index:98;font-weight:700;max-width:92vw}
#toast.on{display:flex}
#toast button{background:#fff;color:#018BD3;border:0;border-radius:10px;padding:8px 14px;font:inherit;font-weight:800;cursor:pointer}
.rapor{width:100%;border-collapse:collapse;font-size:15px}
.rapor th{text-align:left;color:var(--mute);font-size:12px;font-weight:800;padding:6px 6px;border-bottom:2px solid #eef1f5}
.rapor td{padding:8px 6px;border-bottom:1px solid #f1f3f7}
.rapor td.s{text-align:right;font-variant-numeric:tabular-nums}
.rapor th.s{text-align:right}
.tablo-kap{overflow:auto;max-height:70vh;margin-top:12px;border:1px solid #eef1f5;border-radius:12px}
.tablo{font-size:14px}
.tablo th,.tablo td{white-space:nowrap}
.tablo thead th{position:sticky;top:0;background:#f8fafc;z-index:2;text-align:center;line-height:1.25;cursor:pointer;user-select:none}
.tablo thead th.on{color:#018BD3}
.tablo th:first-child,.tablo td.ad{position:sticky;left:0;background:#fff;z-index:1;text-align:left;max-width:170px;overflow:hidden;text-overflow:ellipsis}
.tablo thead th:first-child{z-index:3;background:#f8fafc}
.tablo td.s{text-align:center}
.tablo td.sifir{color:#cbd5e1}
.tablo tfoot td{background:#f8fafc;position:sticky;bottom:0}
.tablo tbody tr:hover td{background:#f0f9ff}
@keyframes akis{to{background-position:-200% 0}}
.hide{display:none!important}
.tv .row{font-size:20px}.tv .no{font-size:20px}
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal .card{width:100%;max-width:420px}
.sug{border:1px solid var(--line);border-radius:10px;margin-top:4px;background:#fff;overflow:hidden}
.sug div{padding:12px;border-bottom:1px solid var(--line);cursor:pointer}
.sug div:last-child{border-bottom:0}
.sug div:hover{background:#e6f4fb}
.liste{max-height:420px;overflow:auto}
.tabs{display:flex;gap:8px;margin-bottom:12px}
/* ---------- Görünüm ---------- */
body{font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:linear-gradient(180deg,#e7f5ec 0,#f3f6fb 340px) no-repeat,#f3f6fb}
header{position:sticky;top:0;z-index:5;backdrop-filter:blur(8px);background:#ffffffe6}
main{padding:16px 14px 40px}
main>*{animation:gir .25s ease both}
@keyframes gir{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{border:0;border-radius:20px;box-shadow:0 1px 2px #0000000a,0 8px 24px #1d24330f}
h2{font-weight:800;letter-spacing:-.2px}h3{font-weight:800}
input,select{border-radius:12px;border:1.5px solid #e1e7ef;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 4px #018bd31f}
.btn{border-radius:14px;font-weight:800;transition:transform .08s,box-shadow .15s,background .15s}
.btn:active{transform:scale(.97)}
.btn:not(.gh):not(.bad):not(.warn){background:linear-gradient(135deg,#05ad4f,#01853a);box-shadow:0 6px 16px #01953f33}
.btn.bad{background:linear-gradient(135deg,#ef5b5b,#c93535);box-shadow:0 6px 16px #d6454533}
.btn.gh{background:#f1f4f8;color:#334155}.btn.gh:hover{background:#e7ecf3}
.btn:disabled{opacity:.4;box-shadow:none!important}
.chip{border:1.5px solid #e1e7ef;font-weight:700;transition:all .15s}
.chip:hover{border-color:#b9c6d6}
.tabs{background:#fff;padding:6px;border-radius:18px;box-shadow:0 2px 12px #1d24330f;gap:4px;overflow-x:auto;flex-wrap:nowrap!important}
.tabs .btn{flex:1;white-space:nowrap;padding:10px 12px}
.tabs .btn.gh{background:transparent;color:#64748b;box-shadow:none}
@media(max-width:520px){.tabs .btn{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 2px;font-size:12.5px;min-width:0}.tabs .ti{font-size:18px}}
#toast button{white-space:nowrap}
#toast{width:max-content}
.msg{border-radius:14px}
.selam{display:flex;align-items:center;gap:14px;padding:18px 18px;background:linear-gradient(135deg,#01953f,#018bd3);color:#fff;border-radius:22px;margin-bottom:14px;box-shadow:0 10px 26px #018bd333}
.selam b{font-size:20px;display:block}.selam span{opacity:.9;font-size:14px}
.selam .av{width:52px;height:52px;font-size:19px;background:#ffffff33!important;border:2px solid #ffffff80}
.ozet{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.kutu{background:#fff;border-radius:18px;padding:12px 14px;box-shadow:0 1px 2px #0000000a,0 6px 18px #1d24330d}
.kutu b{display:block;font-size:30px;line-height:1.1;font-weight:900}
.kutu span{font-size:13px;color:var(--mute);font-weight:700}
.ders-kart{border-top:6px solid var(--dr);padding-top:14px}
.ders-bas{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.ders-ik{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:23px;background:color-mix(in srgb,var(--dr) 14%,#fff);flex:none}
.ders-bas b{font-size:18px;font-weight:900}
.say{min-width:34px;height:34px;padding:0 10px;border-radius:999px;display:grid;place-items:center;font-weight:900;background:color-mix(in srgb,var(--dr) 14%,#fff);color:var(--dr)}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:14px;color:#fff;flex:none;letter-spacing:.3px}
.sure{font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap}
.sure.y{background:#e4f6ec;color:#11683a}.sure.t{background:#fff1d6;color:#9a6200}.sure.k{background:#fde3e3;color:#a12020}
.sira-no{font-size:12px;font-weight:900;color:#94a3b8;min-width:22px;text-align:center}
.now{background:linear-gradient(135deg,#fff8e8,#ffffff);border:1.5px solid #f6d991;border-radius:18px;padding:14px;margin-top:10px}
.now .av{width:48px;height:48px;font-size:17px}
.bos{text-align:center;padding:14px 6px;color:var(--mute);font-weight:700}
.bos i{display:block;font-style:normal;font-size:30px;margin-bottom:4px}
.giris-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.giris-btn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px 12px;border-radius:18px;border:2px solid transparent;background:#f5f8fb;cursor:pointer;font:inherit;font-size:14px;font-weight:800;color:var(--ink);text-align:center;transition:all .15s}
.giris-btn:hover{border-color:var(--blue);background:#eef7fc;transform:translateY(-2px)}
.giris-btn .av{width:50px;height:50px;font-size:18px}
.giris-btn .drs{font-size:11px;color:var(--mute);font-weight:700;line-height:1.2}
.rehber-btn{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border-radius:18px;border:2px solid #018bd355;background:linear-gradient(135deg,#eef7fc,#fff);cursor:pointer;font:inherit;font-weight:800;font-size:16px;color:#016a9f}
.rehber-btn span{font-size:26px}
.kchip{--dr:#64748b}.kchip.on{border-color:var(--dr);background:color-mix(in srgb,var(--dr) 12%,#fff);color:var(--dr)}
@media (max-width:420px){.ozet .kutu{padding:10px}.kutu b{font-size:24px}}
</style>

<div id="modal"></div>
<div id="mesgul"></div>
<div id="toast"><span id="toastY"></span><button id="toastB">↶ Geri al</button></div>

<script>
const P = document.body.dataset.p, URL_ = document.body.dataset.url;
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
/* Sunucu çağrısı. GitHub Pages sürümünde (data-api dolu) Apps Script'e doğrudan JSON isteği atılır;
   Apps Script içinden açıldığında google.script.run kullanılır. */
const API = document.body.dataset.api || "";
/* Bağlantı anlık koparsa bir kez daha dene (telefonlarda sık olur) */
const apiCagir = (fn, a, deneme = 0) =>
  fetch(API, { method: "POST", body: JSON.stringify({ fn: fn, a: a }) })   // text/plain: ön kontrol (CORS) gerekmez
    .then(r => r.json())
    .catch(() => {
      if (deneme < 1) return new Promise(r => setTimeout(r, 800)).then(() => apiCagir(fn, a, deneme + 1));
      throw new Error("İnternet bağlantısı yok ya da sunucuya ulaşılamadı. Tekrar deneyin.");
    })
const run = (fn, ...a) => API
  ? apiCagir(fn, a)
      .then(j => { if (!j.ok) throw new Error(j.hata || "Hata"); return j.data; })
  : new Promise((res, rej) =>
      google.script.run.withSuccessHandler(res).withFailureHandler(e => rej(new Error((e && e.message || String(e)).replace(/^Error:\s*/, ""))))[fn](...a));
const ls = {
  get(k){ try{ return JSON.parse(localStorage.getItem("ss_"+k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem("ss_"+k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem("ss_"+k); }catch(e){} }
};
const saat = t => t ? new Date(t).toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"}) : "";
const dk = (a, simdi) => Math.max(0, Math.round(((simdi||Date.now()) - a) / 60000));
const link = (p, t) => `<a href="${esc(URL_)}${p ? "?p=" + p : ""}" target="_top">${t}</a>`;
const ust = h => { document.getElementById("ust").innerHTML = h; };
const DERS_RENK = { "Matematik":"#2563eb", "Geometri":"#7c3aed", "Fizik":"#0891b2", "Kimya":"#db2777", "Biyoloji":"#16a34a", "Türkçe":"#ea580c", "Tarih":"#a16207", "Coğrafya":"#0d9488" };
const DERS_IKON = { "Matematik":"➗", "Geometri":"📐", "Fizik":"⚛️", "Kimya":"🧪", "Biyoloji":"🧬", "Türkçe":"📖", "Tarih":"🏛️", "Coğrafya":"🌍" };
const renk = d => DERS_RENK[d] || "#64748b", ikon = d => DERS_IKON[d] || "📘";
const PALET = ["#2563eb","#7c3aed","#db2777","#ea580c","#16a34a","#0891b2","#a16207","#4f46e5","#0d9488","#be123c"];
const avatar = ad => { const p = String(ad || "").trim().split(/\s+/), h = [...String(ad || "")].reduce((a, c) => a + c.charCodeAt(0), 0);
  return `<span class="av" style="background:${PALET[h % PALET.length]}">${esc((p[0] || "").charAt(0) + (p.length > 1 ? p[p.length - 1].charAt(0) : ""))}</span>`; };
const sureEt = m => `<span class="sure ${m < 10 ? "y" : m < 30 ? "t" : "k"}">${m} dk</span>`;
const selamla = () => { const h = new Date().getHours(); return h < 12 ? "Günaydın" : h < 18 ? "İyi çalışmalar" : "İyi akşamlar"; };
const yukle = async (fn) => { app.classList.add("yuk"); try { return await fn(); } finally { app.classList.remove("yuk"); } };

/* ================= DURUM ================= */
let kim = ls.get("kim"), ben = ls.get("ben"), V = null, rol = null, sekme = null, mesaj = "",
    derslerim = ls.get("derslerim") || [], L = null, filtre = "";
let kOgr = null, kSec = [], kSonuc = "";                                   // kayıt formu
let gq = { mod: "ogrenci", ogrenci: null, bas: "", son: "", ders: "" }, Gs = null, Gd = null; // geçmiş
let Gt = null, gt = { aralik: "tum", bas: "", son: "", ara: "", sirala: "toplam" }; // öğrenci × ders tablosu

/* ================= GİRİŞ ================= */
/* Arka planda çalışan işlem sayısı: sıfırdan büyükse ince bir çubuk görünür, otomatik yenileme bekler */
let arkada = 0;
const mesgul = d => { arkada += d; document.getElementById("mesgul").classList.toggle("on", arkada > 0); };
/* Son görülen ekranı sakla: giriş/yenilemede önce bunu anında göster, sonra sunucudan tazesini al */
const veriSakla = () => { if (V && kim) ls.set("veri", { ad: kim.ad, gun: bugunStr(), V: V }); };
/* "Beni hatırla" linkiyle açıldıysa kimlik ve ekran verisi sayfayla birlikte geldi */
let ILK = null;
try { ILK = JSON.parse(document.body.dataset.ilk || "null"); } catch (e) {}
if (ILK && ILK.kim && ILK.veri) { kim = ILK.kim; ls.set("kim", kim); }
let hatirlaIste = true;
const gecmisVar = () => typeof google !== "undefined" && google.script && google.script.history;
/* Adres çubuğuna bu telefonun anahtarını yaz: ana ekrana eklenen kısayol şifresiz açılır */
function adresYaz(){
  try { if (gecmisVar()) google.script.history.replace(null, kim && kim.cihaz ? { p: "ogretmen", anahtar: kim.cihaz } : { p: "ogretmen" }); } catch (e) {}
}
async function ogretmen(){
  document.getElementById("baslik").textContent = "Soru Takip";
  if (!kim) return girisCiz();
  if (ILK) {
    V = ILK.veri; ILK = null; veriSakla();
    rol = V.rol; if (rol === "ogretmen") ben = V.ben;
    sekme = rol === "rehber" ? "kayit" : "sira";
    return ciz();
  }
  if (!V) {
    const c = ls.get("veri");
    if (c && c.ad === kim.ad && c.gun === bugunStr() && c.V) {
      V = c.V; rol = V.rol; if (rol === "ogretmen") ben = V.ben;
      if (!sekme) sekme = rol === "rehber" ? "kayit" : "sira";
      ciz();
    } else app.innerHTML = '<div class="card dar mute">Yükleniyor…</div>';
  }
  mesgul(1);
  try {
    const sifreyle = !!kim.sifre;
    V = sifreyle ? await run("girisYap", kim, hatirlaIste) : await run("ogretmenVeri", kim);
    if (V.kim) { kim = V.kim; delete V.kim; ls.set("kim", kim); }  // şifre değil, telefona özel anahtar saklanır
    veriSakla();
    if (kim.cihaz) adresYaz();
    rol = V.rol;
    if (rol === "ogretmen") ben = V.ben;
    if (!sekme || (rol !== "rehber" && sekme !== "sira")) sekme = rol === "rehber" ? "kayit" : "sira";
    ciz();
  } catch(e) {
    if (/Şifre|listede yok/.test(e.message)) { ls.del("kim"); ls.del("veri"); kim = null; V = null; adresYaz(); return girisCiz(null, e.message); }
    if (!V) app.innerHTML = `<div class="card msg bad">${esc(e.message)}</div>`;
  } finally { mesgul(-1); }
}
let girisAd = null, girisListe = null, girisDers = {};
try { const g = JSON.parse(document.body.dataset.giris || "null") || (API ? ls.get("giris") : null); if (g && g.ogretmenler && g.ogretmenler.length) { girisListe = g.ogretmenler; girisDers = g.dersler || {}; } } catch (e) {}
/* Pages sürümü: giriş listesini arka planda tazele (ekran beklemeden önbellekten açılır) */
if (API) run("girisListesi").then(g => { ls.set("giris", g); const yeni = !girisListe; girisListe = g.ogretmenler; girisDers = g.dersler || {}; if (yeni && !kim && !girisAd) girisCiz(); }).catch(() => {});
async function girisCiz(ad, hata){
  ust("");
  if (ad !== undefined) girisAd = ad;
  if (!girisAd) {
    if (!girisListe) {
      app.innerHTML = '<div class="card dar mute">Yükleniyor…</div>';
      try { const g = await run("girisListesi"); girisListe = g.ogretmenler; girisDers = g.dersler || {}; } catch (e) { app.innerHTML = `<div class="card dar msg bad">${esc(e.message)}</div>`; return; }
    }
    app.innerHTML = `<div class="card dar"><h2>Giriş</h2>
      <label style="margin-top:0">Öğretmen misiniz? Adınızı seçin:</label>
      <div class="giris-grid">${girisListe.map(o => `<button class="giris-btn" data-g="${esc(o)}">${avatar(o)}<span>${esc(o)}</span><span class="drs">${esc((girisDers[o] || []).join(" · "))}</span></button>`).join("")}</div>
      <label>Rehberlik servisi:</label>
      <button class="rehber-btn" data-g="Rehberlik"><span>🧭</span> Rehberlik</button>
      ${hata ? `<div class="msg bad">${esc(hata)}</div>` : ""}</div>`;
    app.querySelectorAll("[data-g]").forEach(b => b.onclick = () => girisCiz(b.dataset.g));
    return;
  }
  app.innerHTML = `<div class="card dar" style="text-align:center"><div style="display:flex;justify-content:center;margin-bottom:8px">${girisAd === "Rehberlik" ? '<span style="font-size:44px">🧭</span>' : avatar(girisAd).replace('class="av"', 'class="av" style="width:64px;height:64px;font-size:22px;' + 'background:' + PALET[[...girisAd].reduce((a, c) => a + c.charCodeAt(0), 0) % PALET.length] + '"')}</div><h2>${girisAd === "Rehberlik" ? "Rehberlik" : esc(girisAd)}</h2>
    <p class="mute" style="margin-top:-6px">Şifrenizi girin</p>
    <input id="p" type="password" inputmode="numeric" autocomplete="current-password" style="text-align:center;font-size:24px;letter-spacing:6px">
    <label style="display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;margin:12px 0 4px;cursor:pointer"><input type="checkbox" id="hat" checked style="width:20px;height:20px;margin:0"> Bu telefonda beni hatırla</label>
    <button class="btn big" id="g">Gir</button>
    <button class="btn gh big" id="geri" style="margin-top:8px">← Başka kişi seç</button>
    ${hata ? `<div class="msg bad">${esc(hata)}</div>` : ""}</div>`;
  const go = () => {
    const s = app.querySelector("#p").value.trim(); if (!s) return;
    hatirlaIste = app.querySelector("#hat").checked;
    kim = { ad: girisAd, sifre: s }; ls.del("pin");
    if (!hatirlaIste) ls.del("kim"); // hatırlanmasın: sadece bu açılışta geçerli
    ogretmen();
  };
  app.querySelector("#g").onclick = go;
  app.querySelector("#geri").onclick = () => girisCiz(null);
  app.querySelector("#p").onkeydown = e => { if (e.key === "Enter") go(); };
  app.querySelector("#p").focus();
}

/* ================= 📊 BUGÜN (rehberlik) ================= */
const ort = l => l.length ? Math.round(l.reduce((a, b) => a + b, 0) / l.length / 60000) : null;
const dkYaz = m => m == null ? "–" : m + " dk";
/* Bir dersin bugünkü ortalama çözüm süresi (dk); veri azsa 5 dk varsayılır */
function cozumSure(d, v){
  const l = v.kayitlar.filter(k => k.ders === d && k.durum === "cozuldu" && k.baslama && k.bitis > k.baslama).map(k => k.bitis - k.baslama);
  return l.length >= 2 ? Math.max(1, ort(l)) : 5;
}
function tahminYaz(d, onunde, v){
  const hoca = new Set(v.kayitlar.filter(k => k.ders === d && k.ogretmen && k.durum !== "iptal").map(k => k.ogretmen)).size || 1;
  return ` · tahmini bekleme ≈ ${Math.max(1, Math.round(onunde * cozumSure(d, v) / hoca))} dk`;
}
function bugunCiz(){
  const K = V.kayitlar, simdi = V.simdi || Date.now();
  const bekl = k => k.baslama ? k.baslama - k.eklendi : null;
  const dersler = V.dersler.filter(d => K.some(k => k.ders === d));
  const hocalar = [...new Set(K.filter(k => k.ogretmen && k.durum !== "iptal" && k.ogretmen !== "(gün sonu)").map(k => k.ogretmen))]
    .map(o => ({ ad: o, coz: K.filter(k => k.ogretmen === o && k.durum === "cozuldu"), simdi: K.filter(k => k.ogretmen === o && k.durum === "cozuluyor").length }))
    .sort((a, b) => b.coz.length - a.coz.length);
  const cozulen = K.filter(k => k.durum === "cozuldu").length, bekleyen = K.filter(k => k.durum === "bekliyor").length;
  const enUzun = K.filter(k => k.durum === "bekliyor").sort((a, b) => a.eklendi - b.eklendi)[0];
  app.innerHTML = sekmeler() + msgHtml() + `
  <div class="ozet">
    <div class="kutu"><b style="color:#018bd3">${new Set(K.map(k => k.ogrenci)).size}</b><span>öğrenci geldi</span></div>
    <div class="kutu"><b style="color:#01953f">${cozulen}</b><span>soru çözüldü</span></div>
    <div class="kutu"><b style="color:#d97706">${bekleyen}</b><span>şu an bekliyor</span></div>
  </div>
  ${enUzun ? `<div class="card"><b>⏳ En uzun bekleyen:</b> ${esc(enUzun.ogrenci)} · ${ikon(enUzun.ders)} ${esc(enUzun.ders)} · ${sureEt(dk(enUzun.eklendi, simdi))}</div>` : ""}
  <div class="card"><div class="flex"><h2 style="margin:0">Dersler</h2><span class="sp"></span><button class="btn sm gh" data-a="yenile">↻ Yenile</button></div>
    ${dersler.length ? `<table class="rapor"><tr><th>Ders</th><th class="s">Bekleyen</th><th class="s">Çözülen</th><th class="s">Ort. bekleme</th><th class="s">Ort. çözüm</th></tr>
    ${dersler.map(d => { const l = K.filter(k => k.ders === d);
      return `<tr><td>${ikon(d)} <b>${esc(d)}</b></td><td class="s">${l.filter(k => k.durum === "bekliyor").length}</td><td class="s">${l.filter(k => k.durum === "cozuldu").length}</td>
        <td class="s">${dkYaz(ort(l.map(bekl).filter(x => x != null && x >= 0)))}</td><td class="s">${dkYaz(ort(l.filter(k => k.durum === "cozuldu" && k.bitis > k.baslama).map(k => k.bitis - k.baslama)))}</td></tr>`; }).join("")}</table>`
    : '<div class="bos"><i>🌱</i>Bugün henüz kayıt yok.</div>'}</div>
  ${hocalar.length ? `<div class="card"><h2>Öğretmenler</h2><table class="rapor"><tr><th>Öğretmen</th><th class="s">Çözülen</th><th class="s">Ort. çözüm</th><th class="s">Şu an</th></tr>
    ${hocalar.map(h => `<tr><td>${avatar(h.ad)} ${esc(h.ad)}</td><td class="s"><b>${h.coz.length}</b></td><td class="s">${dkYaz(ort(h.coz.filter(k => k.bitis > k.baslama).map(k => k.bitis - k.baslama)))}</td><td class="s">${h.simdi ? "🟢 " + h.simdi : "–"}</td></tr>`).join("")}</table></div>` : ""}`;
}

let toastZaman = null;
function geriAlGoster(metin, id, onceki, bekleyenIs){
  const t = document.getElementById("toast");

  clearTimeout(toastZaman);
  toastZaman = setTimeout(() => t.classList.remove("on"), 7000);

    clearTimeout(toastZaman); t.classList.remove("on");
    const k = V.kayitlar.find(x => x.id === id);
    if (k) { Object.assign(k, onceki, { bitis: 0 }); mesaj = "Geri alındı."; ciz(); }
    mesgul(1);
    try {

      const v = await run("islem", kim, "geriAl", { id: id, onceki: onceki, ogretmen: ben });

  };
}

/* ---------- 📊 Öğrenci × ders tablosu (sadece rehberlik) ---------- */
function aralikHesapla(a){
  const g = new Date(), f = d => d.toLocaleDateString("sv-SE");
  if (a === "hafta") { const x = new Date(g); x.setDate(g.getDate() - ((g.getDay() + 6) % 7)); return [f(x), f(g)]; }
  if (a === "ay") return [f(new Date(g.getFullYear(), g.getMonth(), 1)), f(g)];
  if (a === "bugun") return [f(g), f(g)];
  if (a === "tarih") return [gt.bas, gt.son];
  return ["", ""];
}
async function tabloYukle(){
  const [bas, son] = aralikHesapla(gt.aralik);
  try { Gt = await yukle(() => run("ogrenciDersTablosu", kim, { bas: bas, son: son })); Gt.bas = bas; Gt.son = son; } catch (e) { alert(e.message); }
  ciz();
}
function tabloSatirlari(){
  const q = (gt.ara || "").toLocaleLowerCase("tr");
  let l = Gt.satirlar.filter(x => !q || x.ad.toLocaleLowerCase("tr").includes(q) || (x.sinif || "").toLocaleLowerCase("tr").includes(q));
  const k = gt.sirala;
  if (k === "ad") l = l.slice().sort((a, b) => a.ad.localeCompare(b.ad, "tr"));
  else if (k === "sinif") l = l.slice().sort((a, b) => (a.sinif || "").localeCompare(b.sinif || "", "tr") || a.ad.localeCompare(b.ad, "tr"));
  else if (k !== "toplam") l = l.slice().sort((a, b) => (b.say[k] || 0) - (a.say[k] || 0) || b.toplam - a.toplam);
  return l;
}
function tabloHtml(){

  let h = `<div class="card"><div class="chips">${ar.map(([k, t]) => `<button class="chip ${gt.aralik === k ? "on" : ""}" data-a="gtAralik" data-k="${k}">${t}</button>`).join("")}</div>
    ${gt.aralik === "tarih" ? `<div class="flex" style="margin-top:10px"><div style="flex:1;min-width:140px"><label style="margin-top:0">Başlangıç</label><input type="date" id="gtbas" value="${esc(gt.bas)}"></div>
      <div style="flex:1;min-width:140px"><label style="margin-top:0">Bitiş</label><input type="date" id="gtson" value="${esc(gt.son)}"></div></div>
      <button class="btn big" data-a="gtGoster" style="margin-top:10px">Göster</button>` : ""}</div>`;
  if (!Gt) return h + '<div class="card mute">Yükleniyor…</div>';
  const D = Gt.dersler, l = tabloSatirlari();
  const bas = Gt.bas ? trTarih(Gt.bas) + (Gt.son && Gt.son !== Gt.bas ? " – " + trTarih(Gt.son) : "") : "Tüm zamanlar";
  const th = (k, t, s) => `<th class="${s ? "s " : ""}srt${gt.sirala === k ? " on" : ""}" data-a="gtSirala" data-k="${esc(k)}">${t}${gt.sirala === k ? " ▼" : ""}</th>`;
  h += `<div class="card"><div class="flex"><b>${bas}</b><span class="sp"></span><span class="badge">${Gt.satirlar.length} öğrenci</span><span class="badge">${Gt.toplam} katılım</span></div>
    <div class="flex" style="margin-top:10px"><input id="gtara" placeholder="🔍 Öğrenci ya da sınıf ara" value="${esc(gt.ara)}" style="flex:1;min-width:160px">
      <button class="btn sm gh" data-a="gtIndir">📥 Excel'e aktar</button></div>`;
  h += !Gt.satirlar.length ? '<div class="bos"><i>🌱</i>Bu aralıkta soru çözümüne katılan öğrenci yok.</div>' : `<div class="tablo-kap"><table class="rapor tablo">
    <thead><tr>${th("ad", "Öğrenci")}${th("sinif", "Sınıf")}${D.map(d => th(d, `${ikon(d)}<br>${esc(d)}`, 1)).join("")}${th("toplam", "Toplam<br>katılım", 1)}</tr></thead>
    <tbody>${l.map(x => `<tr><td class="ad">${esc(x.ad)}</td><td class="mute">${esc(x.sinif || "")}</td>${D.map(d => `<td class="s${x.say[d] ? "" : " sifir"}">${x.say[d] || "·"}</td>`).join("")}<td class="s"><b>${x.toplam}</b></td></tr>`).join("")}</tbody>
    <tfoot><tr><td class="ad"><b>Toplam</b></td><td></td>${D.map(d => `<td class="s"><b>${Gt.dersToplam[d] || 0}</b></td>`).join("")}<td class="s"><b>${Gt.toplam}</b></td></tr></tfoot>
  </table></div>${l.length < Gt.satirlar.length ? `<p class="mute" style="font-size:13px">Aramaya uyan ${l.length} öğrenci gösteriliyor.</p>` : ""}`;
  return h + `<p class="mute" style="font-size:13px;margin-top:8px">Her sayı, öğrencinin o dersten <b>kaç kez soru çözümüne katıldığını</b> gösterir (soru adedi değil). Sıraya yazılıp gelmeyenler ya da çıkarılanlar sayılmaz; "Geçmişi temizle" ile arşive taşınanlar dahil değildir. Sütun başlığına dokunarak sıralayabilirsiniz.</p></div>`;
}
function tabloBagla(){
  if (!Gt) return tabloYukle();
  const a = app.querySelector("#gtara");
  if (a) a.oninput = () => {
    gt.ara = a.value; const p = a.selectionStart;
    app.innerHTML = sekmeler() + msgHtml() + app.querySelector(".tabs").outerHTML + tabloHtml();

function tabloIndir(){
  const D = Gt.dersler, l = tabloSatirlari();
  const h = c => `"${String(c).replace(/"/g, '""')}"`;
  const satir = [["Öğrenci", "Sınıf"].concat(D, ["Toplam katılım"])].concat(l.map(x => [x.ad, x.sinif || ""].concat(D.map(d => x.say[d] || 0), [x.toplam])));
  const csv = "\ufeff" + satir.map(r => r.map(h).join(";")).join("\r\n");
  const u = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  const a = document.createElement("a");
  a.href = u; a.download = `ogrenci-ders-katilim-${Gt.bas || "tum"}${Gt.son && Gt.son !== Gt.bas ? "_" + Gt.son : ""}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000);
}

  try {
    const n = await yukle(() => run("gecmisiTemizle", kim));
    Gs = null; Gd = null; Gt = null; gq.ogrenci = null;
    mesaj = n ? n + " kayıt arşive taşındı." : "Temizlenecek geçmiş kayıt yok.";

  } catch (e) { alert(e.message); }
  ciz();
}

app.addEventListener("click", async e => {
  if (P !== "ogretmen") return;
  const b = e.target.closest("[data-a]"); if (!b) return;
  const a = b.dataset.a;
  switch (a) {
    case "sekme": sekme = b.dataset.s; if (sekme === "liste") L = null; if (sekme === "birebir") BB = null; return ciz();
    case "bbMod": bb.mod = b.dataset.m; return ciz();
    case "bbDers": bb.ders = b.dataset.d; if (!(V.ogretmenDers ? bbHocalar(bb.ders) : []).includes(bb.ogretmen)) bb.ogretmen = ""; return ciz();
    case "bbHoca": bb.ogretmen = b.dataset.o; return ciz();
    case "bbOgrSil": bb.ogrenci = null; return ciz();
    case "bbSec": bb.ogrenci = { ad: b.dataset.s, sinif: b.dataset.c }; return ciz();
    case "bbEkle": return bbKaydet(false);
    case "bbDurum": return bbDurumDegistir(b.dataset.id, b.dataset.d);
    case "yenile": return ogretmen();
    case "benSec": ben = b.dataset.o; ls.set("ben", ben); return ciz();
    case "dersSec": { const d = b.dataset.d; derslerim = derslerim.includes(d) ? derslerim.filter(x => x !== d) : derslerim.concat(d); ls.set("derslerim", derslerim); return ciz(); }
    case "kSec1": kOgr = { ad: b.dataset.s, sinif: b.dataset.c }; return ciz();
    case "kTemizle": kOgr = null; return ciz();
    case "kDers": { const d = b.dataset.d; kSec = kSec.includes(d) ? kSec.filter(x => x !== d) : kSec.concat(d); b.classList.toggle("on", kSec.includes(d)); return; }
    case "kEkle": return kayitEkle();
    case "ekle": case "sil": return listeIslem(a, b.dataset.t, b.dataset.ad);
    case "ogtDers": return ogretmenDersSec(b.dataset.ad);
    case "ogtSifre": return ogretmenSifre(b.dataset.ad);
    case "gmod": gq.mod = b.dataset.m; return ciz();
    case "sirasiz": return sirasizAc();
    case "gtAralik": gt.aralik = b.dataset.k; if (gt.aralik === "tarih") { if (!gt.bas) gt.bas = gt.son = bugunStr(); return ciz(); } return tabloYukle();
    case "gtGoster": gt.bas = app.querySelector("#gtbas").value || bugunStr(); gt.son = app.querySelector("#gtson").value || gt.bas; if (gt.son < gt.bas) [gt.bas, gt.son] = [gt.son, gt.bas]; return tabloYukle();
    case "gtSirala": gt.sirala = b.dataset.k; return ciz();
    case "gtIndir": return tabloIndir();
    case "gdersGoster": return dersGecmisYukle();
    case "gsec": return ogrGecmisYukle({ ad: b.dataset.s, sinif: b.dataset.c });
    case "gTemizle": return gecmisTemizle();
  }
  const arg = { id: b.dataset.id, ders: b.dataset.d, ogretmen: ben };
  if (a === "iptal") {
    const k = V.kayitlar.find(x => x.id === b.dataset.id);
    if (!(await onay(`<b>${esc(k ? k.ogrenci : "")}</b> · ${esc(k ? k.ders : "")}<br>Sıradan çıkarılsın mı?`, "Evet, çıkar"))) return;
  }
  if (a === "bitti") {
    const k = V.kayitlar.find(x => x.id === b.dataset.id);
    if (!(await onay(`<b>${esc(k ? k.ogrenci : "")}</b> · ${esc(k ? k.ders : "")}<br>Soru çözüldü olarak işaretlensin mi?`, "✔ Evet, çözüldü"))) return;
  }
  if (a === "devret") {
    const uygun = V.ogretmenler.filter(o => o !== ben && (rol === "rehber" || (V.ogretmenDers[o] || []).includes(b.dataset.d)));
    if (!uygun.length) return alert("Bu dersi veren başka öğretmen yok.");
    const ad = await secim("Kime devredilsin?", uygun);
    if (!ad) return; arg.yeni = ad;
  }
  if (!["cagir","bitti","geri","sonaAt","iptal","devret"].includes(a)) return;
  if (a === "cagir") {
    // Kimin geleceğini sunucu belirler: sadece bu düğme beklesin, ekran kilitlenmesin
    if (b.classList.contains("bekle")) return;
    b.classList.add("bekle"); mesgul(1);
    try { V = await run("islem", kim, a, arg); mesaj = V.mesaj; veriSakla(); }
    catch(err) { alert(err.message); arkaYenile(); }
    finally { mesgul(-1); }
    return ciz();
  }
  // Çözüldü, geri, sona at, çıkar, devret: ekranda hemen uygula, kaydı arka planda yap
  const k = V.kayitlar.find(x => x.id === arg.id);
  const onceki = k ? { durum: k.durum, ogretmen: k.ogretmen, baslama: k.baslama, sira: k.sira } : null;
  if (k) {
    const t = Date.now();
    if (a === "bitti") Object.assign(k, { durum: "cozuldu", bitis: t });
    if (a === "geri") Object.assign(k, { durum: "bekliyor", ogretmen: "", baslama: 0 });
    if (a === "sonaAt") Object.assign(k, { durum: "bekliyor", ogretmen: "", baslama: 0, sira: t });
    if (a === "iptal") Object.assign(k, { durum: "iptal", bitis: t });
    if (a === "devret") k.ogretmen = arg.yeni;
    mesaj = { bitti: "✔ Kaydedildi.", geri: "Sıraya geri kondu.", sonaAt: "Sıranın sonuna alındı.", iptal: "Sıradan çıkarıldı.", devret: arg.yeni + " öğretmene devredildi." }[a];
    ciz();
  }
  mesgul(1);
  const is = run("islem", kim, a, arg);
  if (k && ["bitti", "iptal", "sonaAt"].includes(a)) geriAlGoster(`${k.ogrenci}: ${{ bitti: "çözüldü", iptal: "sıradan çıkarıldı", sonaAt: "sona alındı" }[a]}`, k.id, onceki, is);
  try { const v = await is; if (arkada === 1) { V = v; mesaj = v.mesaj; veriSakla(); ciz(); } }
  catch(err) { alert(err.message + "\n\nEkran yenileniyor."); arkaYenile(); }
  finally { mesgul(-1); }
});

function onay(metin, evet){
  return new Promise(res => {
    const m = document.getElementById("modal");
    m.innerHTML = `<div class="modal"><div class="card"><h3 style="font-weight:600;line-height:1.5">${metin}</h3>
      <button class="btn ok big" data-y="1">${esc(evet)}</button><button class="btn gh big" style="margin-top:8px" data-y="">Vazgeç</button></div></div>`;
    m.onclick = e => { const b = e.target.closest("[data-y]"); if (!b) return; m.innerHTML = ""; res(!!b.dataset.y); };
  });
}
function cokluSecim(soru, liste, secili){
  return new Promise(res => {
    const sec = new Set(secili || []);
    const m = document.getElementById("modal");
    m.innerHTML = `<div class="modal"><div class="card"><h3 style="font-weight:600;line-height:1.5">${soru}</h3>
      <div class="chips">${liste.map(x => `<button class="chip ${sec.has(x) ? "on" : ""}" data-c="${esc(x)}">${esc(x)}</button>`).join("")}</div>
      <button class="btn ok big" data-y="1">Kaydet</button><button class="btn gh big" style="margin-top:8px" data-y="">Vazgeç</button></div></div>`;
    m.onclick = e => {
      const c = e.target.closest("[data-c]");
      if (c) { sec.has(c.dataset.c) ? sec.delete(c.dataset.c) : sec.add(c.dataset.c); c.classList.toggle("on"); return; }
      const b = e.target.closest("[data-y]"); if (!b) return;
      m.innerHTML = ""; res(b.dataset.y ? liste.filter(x => sec.has(x)) : null);
    };
  });
}
function metinSor(soru){
  return new Promise(res => {
    const m = document.getElementById("modal");
    m.innerHTML = `<div class="modal"><div class="card"><h3 style="font-weight:600;line-height:1.5">${soru}</h3>
      <input id="msor" type="text" inputmode="numeric" autocomplete="off" style="text-align:center;font-size:22px">
      <button class="btn ok big" data-y="1">Kaydet</button><button class="btn gh big" style="margin-top:8px" data-y="">Vazgeç</button></div></div>`;
    const inp = m.querySelector("#msor"); inp.focus();
    m.onclick = e => { const b = e.target.closest("[data-y]"); if (!b) return; const v = inp.value.trim(); m.innerHTML = ""; res(b.dataset.y ? v : null); };
  });
}
function secim(soru, liste){
  return new Promise(res => {
    const m = document.getElementById("modal");
    m.innerHTML = `<div class="modal"><div class="card"><h3>${esc(soru)}</h3><div class="chips">${liste.map(x => `<button class="chip" data-x="${esc(x)}">${esc(x)}</button>`).join("")}</div>
      <button class="btn gh big" data-x="">Vazgeç</button></div></div>`;
    m.onclick = e => { const b = e.target.closest("[data-x]"); if (!b) return; m.innerHTML = ""; res(b.dataset.x || null); };
  });
}
