<style>
:root{--bg:#f3f7f4;--card:#fff;--ink:#1d2433;--mute:#6b7488;--line:#e2e8e4;--pri:#DB2777;--blue:#1E3A8A;--ok:#01953F;--warn:#d98a00;--bad:#d64545}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px}
header{background:#fff;color:var(--ink);padding:10px 16px;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--pri);box-shadow:0 1px 6px #0000000d}

.marka .klv{width:40px;height:40px}
.marka .yz{height:20px;display:block}
.marka .alt{font-size:13px;font-weight:700;color:var(--blue);margin-top:3px;letter-spacing:.3px}
.tv-body .marka .klv{width:56px;height:56px}.tv-body .marka .yz{height:28px}.tv-body .marka .alt{font-size:16px}
header a{color:var(--ink);font-size:14px;text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
main{padding:14px;max-width:1200px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.dar{max-width:560px;margin-left:auto;margin-right:auto}
h2{font-size:20px;margin:0 0 12px}h3{font-size:16px;margin:0 0 8px}
label{display:block;font-weight:600;margin:14px 0 6px}
input,select{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:#fff;color:var(--ink)}
.btn{display:inline-block;border:0;border-radius:10px;padding:12px 16px;font-size:16px;font-weight:600;cursor:pointer;background:var(--pri);color:#fff;text-decoration:none}
.btn.big{width:100%;padding:16px;font-size:18px;margin-top:16px}
.btn.ok{background:var(--ok)}.btn.warn{background:var(--warn)}.btn.bad{background:var(--bad)}.btn.gh{background:#eef1f7;color:var(--ink)}
.btn.sm{padding:7px 10px;font-size:14px}
.btn:disabled{opacity:.45}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:10px 15px;font-size:16px;cursor:pointer;color:var(--ink)}
.chip.on{border-color:var(--blue);background:#e8edf8;color:#1e3a8a;font-weight:700}
.msg{padding:14px;border-radius:10px;margin-top:12px;font-weight:600}
.msg.ok{background:#e4f6ec;color:#11683a}.msg.bad{background:#fde8e8;color:#9b2020}.msg.info{background:#eef1f7}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.no{min-width:44px;text-align:center;font-weight:800;background:#eef1f7;border-radius:8px;padding:4px 6px}
.now{background:#fff6e0;border:1px solid #f1d38a;border-radius:10px;padding:10px;margin-bottom:8px}
.now .no{background:#ffe7a8}
.badge{background:#eef1f7;border-radius:999px;padding:2px 10px;font-size:13px;color:var(--mute);font-weight:400}
h3 .badge{float:right}
.mute{color:var(--mute);font-size:14px}
.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.big-no{font-size:44px;font-weight:800;line-height:1}
.yuk{opacity:.5;pointer-events:none}
.bekle{position:relative;color:transparent!important;pointer-events:none}
.bekle::after{content:"";position:absolute;inset:0;margin:auto;width:18px;height:18px;border:3px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:don .7s linear infinite}
.btn.gh.bekle::after{border-color:rgba(0,0,0,.15);border-top-color:#1E3A8A}
@keyframes don{to{transform:rotate(360deg)}}
#mesgul{position:fixed;top:0;left:0;height:3px;width:100%;background:linear-gradient(90deg,#DB2777,#1E3A8A,#DB2777);background-size:200% 100%;animation:akis 1s linear infinite;z-index:99;display:none}
#mesgul.on{display:block}
.secilebilir{border-radius:12px;margin:-4px;padding:4px}
.secilebilir:hover,.secilebilir:active{background:#f0f9ff}
.ipucu{font-size:13px;margin:-4px 0 6px;text-align:center}
.onc{color:#0f766e;font-weight:800}
.nokta{display:inline-block;min-width:18px;height:18px;padding:0 5px;margin-left:2px;border-radius:9px;background:#dc2626;color:#fff;font:800 11px/18px Nunito,system-ui,sans-serif;font-style:normal;text-align:center;vertical-align:top}
.zil{margin-right:10px;text-decoration:none;font-size:20px;animation:zil 2.4s ease-in-out infinite;display:inline-block}
@keyframes zil{0%,86%,100%{transform:rotate(0)}89%{transform:rotate(14deg)}92%{transform:rotate(-12deg)}95%{transform:rotate(8deg)}}
.bb{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.bb:last-child{border-bottom:0}
#modal .chip.on{background:#DB2777;color:#fff;border-color:#DB2777}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#1f2937;color:#fff;border-radius:14px;padding:10px 12px 10px 16px;display:none;align-items:center;gap:12px;box-shadow:0 8px 24px #0004;z-index:98;font-weight:700;max-width:92vw}
#toast.on{display:flex}
#toast button{background:#fff;color:#1E3A8A;border:0;border-radius:10px;padding:8px 14px;font:inherit;font-weight:800;cursor:pointer}
.rapor{width:100%;border-collapse:collapse;font-size:15px}
.rapor th{text-align:left;color:var(--mute);font-size:12px;font-weight:800;padding:6px 6px;border-bottom:2px solid #eef1f5}
.rapor td{padding:8px 6px;border-bottom:1px solid #f1f3f7}
.rapor td.s{text-align:right;font-variant-numeric:tabular-nums}
.rapor th.s{text-align:right}
.tablo-kap{overflow:auto;max-height:70vh;margin-top:12px;border:1px solid #eef1f5;border-radius:12px}
.tablo{font-size:14px}
.tablo th,.tablo td{white-space:nowrap}
.tablo thead th{position:sticky;top:0;background:#f8fafc;z-index:2;text-align:center;line-height:1.25;cursor:pointer;user-select:none}
.tablo thead th.on{color:#1E3A8A}
.tablo th:first-child,.tablo td.ad{position:sticky;left:0;background:#fff;z-index:1;text-align:left;max-width:170px;overflow:hidden;text-overflow:ellipsis}
.tablo thead th:first-child{z-index:3;background:#f8fafc}
.tablo td.s{text-align:center}
.tablo td.sifir{color:#cbd5e1}
.tablo tfoot td{background:#f8fafc;position:sticky;bottom:0}
.tablo tbody tr:hover td{background:#f0f9ff}
@keyframes akis{to{background-position:-200% 0}}
.hide{display:none!important}
.tv .row{font-size:20px}.tv .no{font-size:20px}
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal .card{width:100%;max-width:420px}
.sug{border:1px solid var(--line);border-radius:10px;margin-top:4px;background:#fff;overflow:hidden}
.sug div{padding:12px;border-bottom:1px solid var(--line);cursor:pointer}
.sug div:last-child{border-bottom:0}
.sug div:hover{background:#e8edf8}
.liste{max-height:420px;overflow:auto}
.tabs{display:flex;gap:8px;margin-bottom:12px}
/* ---------- Görünüm ---------- */
body{font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:linear-gradient(180deg,#fbeaf3 0,#f3f6fb 340px) no-repeat,#f3f6fb}
header{position:sticky;top:0;z-index:5;backdrop-filter:blur(8px);background:#ffffffe6}
main{padding:16px 14px 40px}
main>*{animation:gir .25s ease both}
@keyframes gir{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{border:0;border-radius:20px;box-shadow:0 1px 2px #0000000a,0 8px 24px #1d24330f}
h2{font-weight:800;letter-spacing:-.2px}h3{font-weight:800}
input,select{border-radius:12px;border:1.5px solid #e1e7ef;transition:border-color .15s,box-shadow .15s}

.btn{border-radius:14px;font-weight:800;transition:transform .08s,box-shadow .15s,background .15s}
.btn:active{transform:scale(.97)}
.btn:not(.gh):not(.bad):not(.warn){background:linear-gradient(135deg,#ec4899,#be185d);box-shadow:0 6px 16px #DB277733}
.btn.ok:not(.gh){background:linear-gradient(135deg,#05ad4f,#01853a);box-shadow:0 6px 16px #01953f33}
.btn.bad{background:linear-gradient(135deg,#ef5b5b,#c93535);box-shadow:0 6px 16px #d6454533}
.btn.gh{background:#f1f4f8;color:#334155}.btn.gh:hover{background:#e7ecf3}
.btn:disabled{opacity:.4;box-shadow:none!important}
.chip{border:1.5px solid #e1e7ef;font-weight:700;transition:all .15s}
.chip:hover{border-color:#b9c6d6}
.tabs{background:#fff;padding:6px;border-radius:18px;box-shadow:0 2px 12px #1d24330f;gap:4px;overflow-x:auto;flex-wrap:nowrap!important}
.tabs .btn{flex:1;white-space:nowrap;padding:10px 12px}
.tabs .btn.gh{background:transparent;color:#64748b;box-shadow:none}
@media(max-width:520px){.tabs .btn{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 2px;font-size:12.5px;min-width:0}.tabs .ti{font-size:18px}}
#toast button{white-space:nowrap}
#toast{width:max-content}
.msg{border-radius:14px}
.selam{display:flex;align-items:center;gap:14px;padding:18px 18px;background:linear-gradient(135deg,#DB2777,#1E3A8A);color:#fff;border-radius:22px;margin-bottom:14px;box-shadow:0 10px 26px #1E3A8A33}
.selam b{font-size:20px;display:block}.selam span{opacity:.9;font-size:14px}
.selam .av{width:52px;height:52px;font-size:19px;background:#ffffff33!important;border:2px solid #ffffff80}
.ozet{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.kutu{background:#fff;border-radius:18px;padding:12px 14px;box-shadow:0 1px 2px #0000000a,0 6px 18px #1d24330d}
.kutu b{display:block;font-size:30px;line-height:1.1;font-weight:900}
.kutu span{font-size:13px;color:var(--mute);font-weight:700}
.kutu.tik{cursor:pointer;position:relative;transition:transform .1s}
.kutu.tik:active{transform:scale(.97)}
.kutu.tik::after{content:"›";position:absolute;top:8px;right:12px;font-size:22px;font-weight:800;color:#cbd5e1}
.liste-satir{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.liste-satir:last-child{border-bottom:0}
.ders-kart{border-top:6px solid var(--dr);padding-top:14px}
.ders-bas{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.ders-ik{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:23px;background:color-mix(in srgb,var(--dr) 14%,#fff);flex:none}
.ders-bas b{font-size:18px;font-weight:900}
.say{min-width:34px;height:34px;padding:0 10px;border-radius:999px;display:grid;place-items:center;font-weight:900;background:color-mix(in srgb,var(--dr) 14%,#fff);color:var(--dr)}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:14px;color:#fff;flex:none;letter-spacing:.3px}
.sure{font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap}
.sure.y{background:#e4f6ec;color:#11683a}.sure.t{background:#fff1d6;color:#9a6200}.sure.k{background:#fde3e3;color:#a12020}
.sira-no{font-size:12px;font-weight:900;color:#94a3b8;min-width:22px;text-align:center}
.now{background:linear-gradient(135deg,#fff8e8,#ffffff);border:1.5px solid #f6d991;border-radius:18px;padding:14px;margin-top:10px}
.now .av{width:48px;height:48px;font-size:17px}
.bos{text-align:center;padding:14px 6px;color:var(--mute);font-weight:700}
.bos i{display:block;font-style:normal;font-size:30px;margin-bottom:4px}
.giris-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.giris-btn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px 12px;border-radius:18px;border:2px solid transparent;background:#f5f8fb;cursor:pointer;font:inherit;font-size:14px;font-weight:800;color:var(--ink);text-align:center;transition:all .15s}
.giris-btn:hover{border-color:var(--blue);background:#eef2fb;transform:translateY(-2px)}
.giris-btn .av{width:50px;height:50px;font-size:18px}
.giris-btn .drs{font-size:11px;color:var(--mute);font-weight:700;line-height:1.2}
.rehber-btn{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border-radius:18px;border:2px solid #1E3A8A55;background:linear-gradient(135deg,#eef2fb,#fff);cursor:pointer;font:inherit;font-weight:800;font-size:16px;color:#1e3a8a}
.rehber-btn span{font-size:26px}
.kchip{--dr:#64748b}.kchip.on{border-color:var(--dr);background:color-mix(in srgb,var(--dr) 12%,#fff);color:var(--dr)}
@media (max-width:420px){.ozet .kutu{padding:10px}.kutu b{font-size:24px}}
.kurum-ad{font-weight:900;font-size:16px;color:var(--ink);line-height:1.1;max-width:60vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sube-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.sube-btn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 14px;border-radius:16px;border:2px solid transparent;background:#f5f7fb;cursor:pointer;font:inherit;text-align:left;color:var(--ink)}
.sube-btn:hover{border-color:var(--blue);background:#eef2fb}
.sube-btn b{font-size:20px;font-weight:900}.sube-btn span{font-size:12.5px;color:var(--mute);font-weight:700}
.konu-yer{background:#f8f5fb;border-radius:12px;padding:10px 12px;font-weight:700;line-height:1.35}
.od-satir{display:flex;gap:10px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:10px}
.od-satir:last-child{border-bottom:0}.od-satir:hover{background:#f8fafc}
.od-say{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;max-width:120px;font-weight:800;font-size:13px}
.od-say span{padding:2px 7px;border-radius:999px}.od-say .y{background:#e4f6ec;color:#11683a}.od-say .e{background:#fff1d6;color:#9a6200}.od-say .n{background:#fde3e3;color:#a12020}
.od-say small{width:100%;text-align:right;color:var(--mute);font-weight:700}
.yk-satir{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.yk-satir:last-child{border-bottom:0}
.yk-ad{flex:1;min-width:0;font-weight:700;line-height:1.2}.yk-ad small{display:block;font-size:12px;font-weight:600}
.seg{display:flex;background:#f1f4f8;border-radius:12px;padding:3px;gap:2px;flex:none}
.seg button{border:0;background:transparent;border-radius:9px;padding:7px 9px;font:inherit;font-weight:800;font-size:15px;cursor:pointer;color:#64748b;min-width:40px}
.seg button span{display:none}
.seg button:disabled{opacity:.5;cursor:default}
.seg button.on{color:#fff}
.seg .yk-var,.seg .od-yapti{background:#16a34a}.seg .yk-yok,.seg .od-yapmadi{background:#dc2626}.seg .yk-gec,.seg .od-eksik{background:#d97706}.seg .yk-izinli{background:#64748b}
@media(min-width:560px){.seg button span{display:inline;margin-left:4px;font-size:13px}}
.badge.yk-yok{background:#fde3e3;color:#a12020}.badge.yk-gec{background:#fff1d6;color:#9a6200}.badge.yk-izinli{background:#eef1f5;color:#475569}
.konu-modal{max-width:560px!important;max-height:88vh;display:flex;flex-direction:column}
.konu-liste{overflow:auto;flex:1;margin-top:8px;border-top:1px solid var(--line)}
.konu-bas{position:sticky;top:0;background:#fff;font-size:12px;font-weight:900;color:var(--blue);padding:10px 2px 4px;text-transform:uppercase;letter-spacing:.3px}
.konu-btn{display:block;width:100%;text-align:left;border:0;background:transparent;padding:10px 8px;border-radius:10px;font:inherit;font-weight:700;cursor:pointer;color:var(--ink)}
.konu-btn span{color:var(--mute);font-weight:600}
.konu-btn:hover{background:#f3f4f8}.konu-btn.on{background:#fbeaf3}
.konu-btn .ik-ok{font-style:normal;color:#16a34a;font-weight:900;margin-right:6px}
.islenen{margin-top:8px}
.ik-satir{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line)}
.ik-satir:last-child{border-bottom:0}
.ik-tarih{flex:none;width:86px;font-size:12.5px;font-weight:800;color:var(--blue)}
.ik-konu{flex:1;min-width:0;line-height:1.3}.ik-konu small{display:block;font-size:12px}
/* ---------- Modern düğmeler (Kasım 2026) ----------
   Düz renk, ince gölge, 44px dokunma alanı, klavye odağı halkası. Ana renk pembe, ikincil düğmeler beyaz kenarlıklı.
   Sekmeler iOS tarzı bölümlü denetim: seçili sekme beyaz kart. */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:12px;border:1px solid transparent;
  font-weight:700;font-size:15.5px;letter-spacing:.1px;line-height:1.2;text-align:center;-webkit-tap-highlight-color:transparent;
  transition:background .15s,border-color .15s,box-shadow .15s,transform .08s,color .15s}
.btn:active{transform:translateY(1px) scale(.99)}
.btn:not(.gh):not(.bad):not(.warn):not(.ok){background:var(--pri);color:#fff;box-shadow:0 1px 2px #be185d40,inset 0 1px 0 #ffffff2e}
.btn:not(.gh):not(.bad):not(.warn):not(.ok):hover{background:#c81e6c}
.btn.ok:not(.gh):not(.bad):not(.warn){background:#16a34a;color:#fff;box-shadow:0 1px 2px #15803d40,inset 0 1px 0 #ffffff2e}
.btn.ok:not(.gh):not(.bad):not(.warn):hover{background:#15803d}
.btn.bad{background:#dc2626;color:#fff;box-shadow:0 1px 2px #b91c1c40,inset 0 1px 0 #ffffff2e}.btn.bad:hover{background:#b91c1c}
.btn.warn{background:#d97706;color:#fff;box-shadow:0 1px 2px #b4530940}.btn.warn:hover{background:#b45309}
.btn.gh{background:#fff;color:#1e293b;border-color:#e2e8f0;box-shadow:0 1px 2px #0f172a0d}
.btn.gh:hover{background:#f8fafc;border-color:#cbd5e1}
.btn.big{min-height:52px;padding:14px 18px;font-size:17px;border-radius:14px}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:10px;gap:6px}
.btn:disabled,.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none!important}
.btn:focus-visible,.chip:focus-visible,.seg button:focus-visible,.giris-btn:focus-visible,.rehber-btn:focus-visible,.sube-btn:focus-visible,.konu-btn:focus-visible,header a:focus-visible{
  outline:none;box-shadow:0 0 0 2px #fff,0 0 0 4px #db2777aa!important}
.tabs{background:#eef1f6;padding:4px;border-radius:14px;box-shadow:none;gap:2px}
.tabs .btn{min-height:42px;border-radius:10px;font-weight:700;border:0}
.tabs .btn.gh{background:transparent;color:#64748b;box-shadow:none}
.tabs .btn.gh:hover{background:#ffffff99;color:#334155}
.tabs .btn:not(.gh):not(.bad):not(.warn):not(.ok){background:#fff;color:var(--pri);box-shadow:0 1px 3px #0f172a1f,0 1px 1px #0f172a0a}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:8px 14px;border:1px solid #e2e8f0;border-radius:999px;background:#fff;
  font-size:15px;font-weight:600;color:#1e293b;transition:background .15s,border-color .15s,color .15s}
.chip:hover{background:#f8fafc;border-color:#cbd5e1}
.chip.on:not(.kchip){background:#fdf2f8;border-color:var(--pri);color:#9d174d;font-weight:700}
.kchip.on{border-color:var(--dr);background:color-mix(in srgb,var(--dr) 10%,#fff);color:var(--dr);font-weight:700}
#modal .chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.seg{background:#f1f5f9;border-radius:12px;padding:3px}
.seg button{min-height:36px;border-radius:9px;transition:background .15s,color .15s}
.seg button:not(.on):not(:disabled):hover{background:#fff;color:#334155}

<script>
const P = document.body.dataset.p, URL_ = document.body.dataset.url;
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
/* Sunucu çağrısı. GitHub Pages sürümünde (data-api dolu) Apps Script'e doğrudan JSON isteği atılır;
   Apps Script içinden açıldığında google.script.run kullanılır. */
const API = document.body.dataset.api || "";
/* Bağlantı anlık koparsa bir kez daha dene (telefonlarda sık olur) */
const apiCagir = (fn, a, deneme = 0) =>
  fetch(API, { method: "POST", body: JSON.stringify({ fn: fn, a: a }) })   // text/plain: ön kontrol (CORS) gerekmez
    .then(r => r.json())
    .catch(() => {
      if (deneme < 1) return new Promise(r => setTimeout(r, 800)).then(() => apiCagir(fn, a, deneme + 1));
      throw new Error("İnternet bağlantısı yok ya da sunucuya ulaşılamadı. Tekrar deneyin.");
    })
const run = (fn, ...a) => API
  ? apiCagir(fn, a)
      .then(j => { if (!j.ok) throw new Error(j.hata || "Hata"); return j.data; })
  : new Promise((res, rej) =>
      google.script.run.withSuccessHandler(res).withFailureHandler(e => rej(new Error((e && e.message || String(e)).replace(/^Error:\s*/, ""))))[fn](...a));
const ls = {
  get(k){ try{ return JSON.parse(localStorage.getItem("ss_"+k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem("ss_"+k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem("ss_"+k); }catch(e){} }
};
const saat = t => t ? new Date(t).toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"}) : "";
const dk = (a, simdi) => Math.max(0, Math.round(((simdi||Date.now()) - a) / 60000));
const link = (p, t) => `<a href="${esc(URL_)}${p ? "?p=" + p : ""}" target="_top">${t}</a>`;
const ust = h => { document.getElementById("ust").innerHTML = h; };
const DERS_RENK = { "Matematik":"#2563eb", "Geometri":"#7c3aed", "Fizik":"#0891b2", "Kimya":"#db2777", "Biyoloji":"#16a34a", "Türkçe":"#ea580c", "Tarih":"#a16207", "Coğrafya":"#0d9488" };
const DERS_IKON = { "Matematik":"➗", "Geometri":"📐", "Fizik":"⚛️", "Kimya":"🧪", "Biyoloji":"🧬", "Türkçe":"📖", "Tarih":"🏛️", "Coğrafya":"🌍" };
const renk = d => DERS_RENK[d] || "#64748b", ikon = d => DERS_IKON[d] || "📘";
const PALET = ["#2563eb","#7c3aed","#db2777","#ea580c","#16a34a","#0891b2","#a16207","#4f46e5","#0d9488","#be123c"];
const avatar = ad => { const p = String(ad || "").trim().split(/\s+/), h = [...String(ad || "")].reduce((a, c) => a + c.charCodeAt(0), 0);
  return `<span class="av" style="background:${PALET[h % PALET.length]}">${esc((p[0] || "").charAt(0) + (p.length > 1 ? p[p.length - 1].charAt(0) : ""))}</span>`; };
/* Sıra düzeni sunucuyla aynı: önce öncelik (az gelen öne), sonra geliş sırası */
const onc = k => k.oncelik == null ? 2 : k.oncelik;
const siraKarsilastir = (a, b) => (onc(a) - onc(b)) || (a.sira - b.sira) || (a.no - b.no);
const oncelikEtiket = k => onc(k) === 0 ? ' · <span class="onc">🆕 ilk kez</span>' : onc(k) === 1 ? ' · <span class="onc">🌱 az geldi</span>' : "";
const sureEt = m => `<span class="sure ${m < 10 ? "y" : m < 30 ? "t" : "k"}">${m} dk</span>`;
const selamla = () => { const h = new Date().getHours(); return h < 12 ? "Günaydın" : h < 18 ? "İyi çalışmalar" : "İyi akşamlar"; };
const yukle = async (fn) => { app.classList.add("yuk"); try { return await fn(); } finally { app.classList.remove("yuk"); } };

/* ================= DURUM ================= */
/* Kurum: ana ekranda kurum kodu girilir; kodu ve adı telefonda saklanır. Eski telefonlarda (kod yok) ve
   Apps Script'teki eski linkte varsayılan kurum: Eğitim Atölyesi. */
const EA_KURUM = { kod: "EgitimAtolyesi01", ad: "Eğitim Atölyesi" };
let KURUM = ls.get("kurum");
let kim = ls.get("kim"), ben = ls.get("ben"), V = null, rol = null, sekme = null, mesaj = "",
    derslerim = ls.get("derslerim") || [], L = null, filtre = "";

/* İsim arama kutusu (kayıt ve geçmiş ortak) */
function aramaBagla(inp, kutu, eylem){
  let zam, son = "";
  inp.oninput = () => {
    clearTimeout(zam);
    const q = inp.value.trim();
    if (q.length < 2) { kutu.innerHTML = ""; return; }
    zam = setTimeout(async () => {
      son = q;
      try {
        const l = await run("ogrenciAra", kim, q);
        if (son !== q) return;
        kutu.innerHTML = l.length ? `<div class="sug">${l.map(x => `<div data-a="${eylem}" data-s="${esc(x.ad)}" data-c="${esc(x.sinif)}">${esc(x.ad)}${x.sinif ? ` <span class="mute">· ${esc(x.sinif)}</span>` : ""}</div>`).join("")}</div>`
                                   : '<p class="mute">Bu isimde öğrenci bulunamadı.</p>';
      } catch (e) { kutu.innerHTML = `<p class="mute">${esc(e.message)}</p>`; }
    }, 300);
  };
}

/* Sırasız çözüm: sıraya yazılmamış öğrencinin sorusu çözüldüyse doğrudan "çözüldü" kaydı */
function sirasizAc(){
  const atanmis = rol === "ogretmen";
  const secili = derslerim.filter(d => V.dersler.includes(d));
  const dersler = atanmis ? V.benimDerslerim : (secili.length ? secili : V.dersler);
  let ders = dersler.length === 1 ? dersler[0] : "", secilen = null;
  const m = document.getElementById("modal");
  const ciz_ = hata => {
    m.innerHTML = `<div class="modal"><div class="card">
      <h3 style="font-weight:800;margin-top:0">➕ Sırasız çözüm</h3>
      <p class="mute" style="margin-top:-6px">Sıraya yazılmamış bir öğrencinin sorusunu çözdüyseniz buradan "çözüldü" olarak kaydedin.</p>
      <label>Öğrencinin adı</label>
      <input id="sad" autocomplete="off" placeholder="Adını yaz, listeden seç" value="${esc(secilen ? secilen.ad : (m.dataset.yazi || ""))}">
      <div id="ssug"></div>
      <label>Ders</label>
      <div class="chips">${dersler.map(d => `<button class="chip ${d === ders ? "on" : ""}" data-sd="${esc(d)}">${ikon(d)} ${esc(d)}</button>`).join("")}</div>
      <label>Not (isteğe bağlı)</label><input id="snot" maxlength="200" placeholder="ör. 3 soru, türev">
      ${hata ? `<div class="msg bad" style="margin-top:10px">${esc(hata)}</div>` : ""}
      <div class="flex" style="margin-top:14px"><button class="btn ok big" data-sk="1" style="flex:1">✔ Çözüldü olarak kaydet</button><button class="btn gh big" data-sk="0">Vazgeç</button></div>
    </div></div>`;
    m.onclick = tik; // onay penceresi kendi işleyicisini koyar; her çizimde geri al
    const inp = m.querySelector("#sad"), kutu = m.querySelector("#ssug");
    aramaBagla(inp, kutu, "sSec");
    inp.addEventListener("input", () => { secilen = null; m.dataset.yazi = inp.value; });
    if (!secilen) inp.focus();
  };
  const kaydet = async listeDisi => {
    const ad = secilen ? secilen.ad : m.querySelector("#sad").value.trim();
    if (ad.length < 2) return ciz_("Öğrencinin adını yazın.");
    if (!ders) return ciz_("Ders seçin.");
    const notu = m.querySelector("#snot").value;
    const b = m.querySelector('[data-sk="1"]'); b.classList.add("bekle"); mesgul(1);
    try {
      V = await run("sirasizCozum", kim, { ad: ad, ders: ders, notu: notu, listeDisi: listeDisi, ogretmen: ben });
      mesaj = V.mesaj; veriSakla(); m.innerHTML = ""; m.dataset.yazi = ""; ciz();
    } catch (e) {
      if (e.message === "LISTEDE_YOK") {
        m.innerHTML = "";
        if (await onay(`<b>${esc(ad)}</b> öğrenci listesinde yok.<br>Yine de bu adla kaydedilsin mi?<br><span class="mute" style="font-size:14px">İsterseniz rehberlik sonra öğrenci listesine ekleyebilir.</span>`, "✔ Evet, kaydet")) return kaydetDis(ad, notu);
        return ciz_();
      }
      ciz_(e.message);
    } finally { mesgul(-1); }
  };
  const kaydetDis = async (ad, notu) => {
    mesgul(1);
    try { V = await run("sirasizCozum", kim, { ad: ad, ders: ders, notu: notu, listeDisi: true, ogretmen: ben }); mesaj = V.mesaj; veriSakla(); m.dataset.yazi = ""; ciz(); }
    catch (e) { alert(e.message); }
    finally { mesgul(-1); }
  };
  const tik = e => {
    const sd = e.target.closest("[data-sd]"); if (sd) { ders = sd.dataset.sd; m.querySelectorAll("[data-sd]").forEach(x => x.classList.toggle("on", x === sd)); return; }
    const sg = e.target.closest('[data-a="sSec"]'); if (sg) { secilen = { ad: sg.dataset.s, sinif: sg.dataset.c }; const i = m.querySelector("#sad"); i.value = secilen.ad + (secilen.sinif ? " · " + secilen.sinif : ""); m.querySelector("#ssug").innerHTML = ""; return; }
    const sk = e.target.closest("[data-sk]"); if (!sk) return;
    if (sk.dataset.sk === "0") { m.innerHTML = ""; m.dataset.yazi = ""; return; }
    kaydet(false);
  };
  ciz_();
}

/* Sıranın istediği yerinden çağır (adına dokununca ya da listeden) */
async function seciliCagir(id, b){
  const k = V.kayitlar.find(x => x.id === id); if (!k) return;
  if (k.mesgul) return alert(k.ogrenci + " şu an başka bir öğretmende. Önce o öğretmenin işi bitmeli.");
  const sira = V.kayitlar.filter(x => x.durum === "bekliyor" && x.ders === k.ders && siraKarsilastir(x, k) < 0).length + 1;
  if (!(await onay(`<b>${esc(k.ogrenci)}</b> şimdi çağrılsın mı?<br><span class="mute" style="font-size:14px">${ikon(k.ders)} ${esc(k.ders)} · sırada ${sira}. kişi</span>`, "📣 Evet, çağır"))) return;
  if (b && b.classList.contains("bekle")) return;
  if (b) b.classList.add("bekle");
  mesgul(1);
  try { V = await run("islem", kim, "cagir", { ogretmen: ben, ders: k.ders, id: k.id }); mesaj = V.mesaj; veriSakla(); }
  catch (err) { alert(err.message); arkaYenile(); }
  finally { mesgul(-1); }
  ciz();
}
/* Üstteki kutulara dokununca: bekleyenler / bugün çözdüklerim listesi; "şu an benimle" o karta kaydırır */
function kutuListe(tur){
  if (tur === "benim") { const c = [...app.querySelectorAll("h2")].find(h => /Şu an benimle/.test(h.textContent)); if (c) c.closest(".card").scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  const t = { ad: ben }, simdi = V.simdi || Date.now(), K = V.kayitlar;
  const atanmis = rol === "ogretmen";
  const secili = derslerim.filter(d => V.dersler.includes(d));
  const dersler = atanmis ? V.benimDerslerim : (secili.length ? secili : V.dersler);
  const bekleyen = d => K.filter(k => k.durum === "bekliyor" && k.ders === d).sort(siraKarsilastir);
  let baslik, govde;
  if (tur === "bekleyen") {
    const gruplar = dersler.map(d => [d, bekleyen(d)]).filter(([, l]) => l.length);
    const toplam = gruplar.reduce((n, [, l]) => n + l.length, 0);
    baslik = `⏳ Bekleyenler (${toplam})`;
    govde = gruplar.length ? gruplar.map(([d, l]) => `<div style="margin-top:8px"><b>${ikon(d)} ${esc(d)}</b> <span class="mute">· ${l.length} kişi</span></div>` + l.map((k, i) =>
      `<div class="liste-satir"><span class="sira-no">${i + 1}</span>${avatar(k.ogrenci)}<div class="sp"><b>${esc(k.ogrenci)}</b><div class="mute" style="font-size:13px">No ${k.no}${oncelikEtiket(k)}${k.notu ? " · 📝 " + esc(k.notu) : ""}${k.mesgul ? " · ⏳ başka öğretmende" : ""}</div></div>
        ${sureEt(dk(k.eklendi, simdi))}${k.mesgul ? "" : `<button class="btn sm ok" data-lc="${esc(k.id)}" title="Çağır">📣</button>`}</div>`).join("")).join("")
      : '<div class="bos"><i>🎉</i>Bekleyen öğrenci yok.</div>';
  } else {
    const l = K.filter(k => k.durum === "cozuldu" && k.ogretmen === t.ad).sort((a, b) => (b.bitis || 0) - (a.bitis || 0));
    const sureler = l.filter(k => k.baslama && k.bitis > k.baslama).map(k => (k.bitis - k.baslama) / 60000);
    baslik = `✔ Bugün çözdüklerim (${l.length})`;
    govde = l.length ? (sureler.length ? `<p class="mute" style="margin-top:-4px">Ortalama ${Math.max(1, Math.round(sureler.reduce((a, b) => a + b, 0) / sureler.length))} dk</p>` : "") + l.map(k =>
      `<div class="liste-satir"><span class="mute" style="min-width:44px;font-weight:800">${saat(k.bitis)}</span>${avatar(k.ogrenci)}<div class="sp"><b>${esc(k.ogrenci)}</b>
        <div class="mute" style="font-size:13px">${ikon(k.ders)} ${esc(k.ders)}${k.baslama && k.bitis > k.baslama ? ` · ${Math.max(1, Math.round((k.bitis - k.baslama) / 60000))} dk` : ""}${/sırasız/.test(k.kaydeden || "") ? " · sırasız" : ""}${k.notu && k.notu !== "Sırasız çözüm" ? " · 📝 " + esc(k.notu) : ""}</div></div></div>`).join("")
      : '<div class="bos"><i>🌱</i>Bugün henüz çözdüğünüz soru yok.</div>';
  }
  const m = document.getElementById("modal");
  m.innerHTML = `<div class="modal"><div class="card" style="max-height:85vh;overflow:auto"><h3 style="font-weight:800;margin-top:0">${baslik}</h3>${govde}
    <button class="btn gh big" data-y="" style="margin-top:12px">Kapat</button></div></div>`;
  m.onclick = e => {
    const c = e.target.closest("[data-lc]"); if (c) { m.innerHTML = ""; return seciliCagir(c.dataset.lc); }
    if (e.target.closest("[data-y]") || e.target.classList.contains("modal")) m.innerHTML = "";
  };
}

const bbHocalar = d => V.ogretmenler.filter(o => (V.ogretmenDers[o] || []).includes(d));

    <label>Not (isteğe bağlı)</label><input id="bbnot" maxlength="200" placeholder="ör. limit konusu, cuma 15:00" value="${esc(bb.notu)}">

async function bbDurumDegistir(id, d){

/* ================= 📋 SIRALAR ================= */

/* ================= 📊 BUGÜN (rehberlik) ================= */
const ort = l => l.length ? Math.round(l.reduce((a, b) => a + b, 0) / l.length / 60000) : null;
const dkYaz = m => m == null ? "–" : m + " dk";
/* Bir dersin bugünkü ortalama çözüm süresi (dk); veri azsa 5 dk varsayılır */
function cozumSure(d, v){
  const l = v.kayitlar.filter(k => k.ders === d && k.durum === "cozuldu" && k.baslama && k.bitis > k.baslama).map(k => k.bitis - k.baslama);
  return l.length >= 2 ? Math.max(1, ort(l)) : 5;
}
function tahminYaz(d, onunde, v){
  const hoca = new Set(v.kayitlar.filter(k => k.ders === d && k.ogretmen && k.durum !== "iptal").map(k => k.ogretmen)).size || 1;
  return ` · tahmini bekleme ≈ ${Math.max(1, Math.round(onunde * cozumSure(d, v) / hoca))} dk`;
}
function bugunCiz(){
  const K = V.kayitlar, simdi = V.simdi || Date.now();
  const bekl = k => k.baslama ? k.baslama - k.eklendi : null;
  const dersler = V.dersler.filter(d => K.some(k => k.ders === d));
  const hocalar = [...new Set(K.filter(k => k.ogretmen && k.durum !== "iptal" && k.ogretmen !== "(gün sonu)").map(k => k.ogretmen))]
    .map(o => ({ ad: o, coz: K.filter(k => k.ogretmen === o && k.durum === "cozuldu"), simdi: K.filter(k => k.ogretmen === o && k.durum === "cozuluyor").length }))
    .sort((a, b) => b.coz.length - a.coz.length);
  const cozulen = K.filter(k => k.durum === "cozuldu").length, bekleyen = K.filter(k => k.durum === "bekliyor").length;
  const enUzun = K.filter(k => k.durum === "bekliyor").sort((a, b) => a.eklendi - b.eklendi)[0];
  app.innerHTML = sekmeler() + msgHtml() + `
  <div class="ozet">
    <div class="kutu"><b style="color:#1E3A8A">${new Set(K.map(k => k.ogrenci)).size}</b><span>öğrenci geldi</span></div>
    <div class="kutu"><b style="color:#DB2777">${cozulen}</b><span>soru çözüldü</span></div>
    <div class="kutu"><b style="color:#d97706">${bekleyen}</b><span>şu an bekliyor</span></div>
  </div>
  ${enUzun ? `<div class="card"><b>⏳ En uzun bekleyen:</b> ${esc(enUzun.ogrenci)} · ${ikon(enUzun.ders)} ${esc(enUzun.ders)} · ${sureEt(dk(enUzun.eklendi, simdi))}</div>` : ""}
  <div class="card"><div class="flex"><h2 style="margin:0">Dersler</h2><span class="sp"></span><button class="btn sm gh" data-a="yenile">↻ Yenile</button></div>
    ${dersler.length ? `<table class="rapor"><tr><th>Ders</th><th class="s">Bekleyen</th><th class="s">Çözülen</th><th class="s">Ort. bekleme</th><th class="s">Ort. çözüm</th></tr>
    ${dersler.map(d => { const l = K.filter(k => k.ders === d);
      return `<tr><td>${ikon(d)} <b>${esc(d)}</b></td><td class="s">${l.filter(k => k.durum === "bekliyor").length}</td><td class="s">${l.filter(k => k.durum === "cozuldu").length}</td>
        <td class="s">${dkYaz(ort(l.map(bekl).filter(x => x != null && x >= 0)))}</td><td class="s">${dkYaz(ort(l.filter(k => k.durum === "cozuldu" && k.bitis > k.baslama).map(k => k.bitis - k.baslama)))}</td></tr>`; }).join("")}</table>`
    : '<div class="bos"><i>🌱</i>Bugün henüz kayıt yok.</div>'}</div>
  ${hocalar.length ? `<div class="card"><h2>Öğretmenler</h2><table class="rapor"><tr><th>Öğretmen</th><th class="s">Çözülen</th><th class="s">Ort. çözüm</th><th class="s">Şu an</th></tr>
    ${hocalar.map(h => `<tr><td>${avatar(h.ad)} ${esc(h.ad)}</td><td class="s"><b>${h.coz.length}</b></td><td class="s">${dkYaz(ort(h.coz.filter(k => k.bitis > k.baslama).map(k => k.bitis - k.baslama)))}</td><td class="s">${h.simdi ? "🟢 " + h.simdi : "–"}</td></tr>`).join("")}</table></div>` : ""}`;
}

let toastZaman = null;
function geriAlGoster(metin, id, onceki, bekleyenIs){
  const t = document.getElementById("toast");
  document.getElementById("toastY").textContent = metin;
  t.classList.add("on");
  clearTimeout(toastZaman);
  toastZaman = setTimeout(() => t.classList.remove("on"), 7000);
  document.getElementById("toastB").onclick = async () => {
    clearTimeout(toastZaman); t.classList.remove("on");
    const k = V.kayitlar.find(x => x.id === id);
    if (k) { Object.assign(k, onceki, { bitis: 0 }); mesaj = "Geri alındı."; ciz(); }
    mesgul(1);
    try {
      await bekleyenIs.catch(() => {});           // önce asıl işlem sunucuda bitsin
      const v = await run("islem", kim, "geriAl", { id: id, onceki: onceki, ogretmen: ben });
      if (arkada === 1) { V = v; veriSakla(); ciz(); }
    } catch (err) { alert(err.message); arkaYenile(); }
    finally { mesgul(-1); }
  };
}

function csvIndir(ad, satirlar){
  const h = c => `"${String(c).replace(/"/g, '""')}"`;
  const u = URL.createObjectURL(new Blob(["\ufeff" + satirlar.map(r => r.map(h).join(";")).join("\r\n")], { type: "text/csv;charset=utf-8" }));
  const a = document.createElement("a");
  a.href = u; a.download = ad;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000);
}
function tabloIndir(){

  const u = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  const a = document.createElement("a");

}

/* Konu seçici: dersin konu listesi, şubenin sınıfına göre süzülür ("Tüm sınıflar" ile hepsi) */
async function konuSecModal(ders, ops){
  ops = ops || (SB.veri ? { sinif: String(SB.veri.sube.sinif), kal: SB.veri.kaldigi[ders], islenen: (SB.veri.islenen || {})[ders] } : {});
  if (!KONU[ders]) {
    try { KONU[ders] = await yukle(() => run("konuListesi", kim, ders)); } catch (e) { alert(e.message); return null; }
  }
  const l = KONU[ders];
  if (!l.length) { alert(ders + " için konu listesi boş. Rehberlik e-tablodaki Konular sayfasını doldurmalı."); return null; }
  const sinif = String(ops.sinif || "");
  const sinifVar = l.some(k => k.sinif === sinif);
  const kal = ops.kal;
  const isl = new Set((ops.islenen || []).map(k => [k.sinif, k.unite, k.konu, k.alt].join("|")));
  let hepsi = !sinifVar, ara = "";
  return new Promise(res => {
    const m = document.getElementById("modal");
    const liste = () => {
      const q = ara.toLocaleLowerCase("tr");
      const s = l.map((k, i) => ({ k, i })).filter(({ k }) => (hepsi || k.sinif === sinif) && (!q || konuYazi(k).toLocaleLowerCase("tr").includes(q)));
      let son = "";
      return s.length ? s.map(({ k, i }) => {
        const bas = `${k.sinif}. sınıf · ${k.unite}`;
        const h = bas !== son ? `<div class="konu-bas">${esc(bas)}</div>` : ""; son = bas;
        const on = kal && kal.sinif === k.sinif && kal.unite === k.unite && kal.konu === k.konu && kal.alt === k.alt;
        const ok = isl.has([k.sinif, k.unite, k.konu, k.alt].join("|"));
        return h + `<button class="konu-btn ${on ? "on" : ""}" data-k="${i}">${ok ? '<i class="ik-ok" title="İşlendi">✓</i>' : ""}${esc(k.konu)}${k.alt ? ` <span>› ${esc(k.alt)}</span>` : ""}${on ? " 📍" : ""}</button>`;
      }).join("") : '<p class="mute">Eşleşen konu yok.</p>';
    };
    m.innerHTML = `<div class="modal"><div class="card konu-modal"><h3>📍 ${esc(ders)} konuları</h3>
      <input id="kara" placeholder="🔍 Konu ara" autocomplete="off">
      ${sinifVar ? `<label style="display:flex;align-items:center;gap:8px;margin:8px 0;font-weight:600"><input type="checkbox" id="khepsi" style="width:18px;height:18px;margin:0" ${hepsi ? "checked" : ""}> Tüm sınıfların konuları</label>` : ""}
      <div class="konu-liste" id="kliste">${liste()}</div>
      <button class="btn gh big" data-k="" style="margin-top:10px">Vazgeç</button></div></div>`;
    const kl = m.querySelector("#kliste");
    m.querySelector("#kara").oninput = e => { ara = e.target.value; kl.innerHTML = liste(); };
    const kh = m.querySelector("#khepsi"); if (kh) kh.onchange = () => { hepsi = kh.checked; kl.innerHTML = liste(); };
    const on = kl.querySelector(".on"); if (on) on.scrollIntoView({ block: "center" });
    m.onclick = e => { const b = e.target.closest("[data-k]"); if (!b) return; m.innerHTML = ""; res(b.dataset.k === "" ? null : l[Number(b.dataset.k)]); };
  });
}
async function sinifTikla(a, b){
  switch (a) {
    case "ikHepsi": SB.islenenHepsi = !SB.islenenHepsi; return ciz();
    case "subeSec": return sbAc(b.dataset.s);

    case "sbDers": SB.ders = b.dataset.d; ls.set("subeDers", SB.ders); return ciz();
    case "sbOzet": SB.mod = "ozet"; SB.odev = null; return ciz();
    case "konuSec": { const k = await konuSecModal(SB.ders); if (k) await sbIslem("konuKaydet", { sube: SB.secili, ders: SB.ders, konu: k }); return; }
    case "ykAc": SB.yk = null; SB.ykKonu = null; SB.mod = "yoklama"; return ciz();
    case "ykD": {
      SB.yk[b.dataset.o] = b.dataset.d;
      b.parentNode.querySelectorAll("button").forEach(x => x.className = x === b ? "on yk-" + b.dataset.d : "");
      const say = d => Object.values(SB.yk).filter(x => x === d).length;
      app.querySelector("#ykSay").textContent = `${say("var")} var · ${say("yok")} yok · ${say("gec")} geç · ${say("izinli")} izinli`;
      return;
    }
    case "ykKonu": { const k = await konuSecModal(SB.ders); if (k) { SB.ykKonu = k; ciz(); } return; }
    case "ykKaydet": {
      const g = app.querySelector("#ykGerekce");
      const ya = { sube: SB.secili, ders: SB.ders, durumlar: Object.assign({}, SB.yk), konu: SB.ykKonu, gerekce: g ? g.value.trim() : "", tarih: bugunStr() };
      SB.ykGerekce = ya.gerekce;
      const mevcut = (SB.veri.yoklama[SB.ders] || {}).durum;
      if (g && mevcut && Object.keys(SB.yk).some(ad => (mevcut[ad] || "var") !== SB.yk[ad]) && ya.gerekce.length < 3) { g.focus(); return alert("Kaydedilmiş yoklamayı değiştiriyorsunuz: düzeltme gerekçesini yazın."); }
      return ykGonder(ya);
    }
    case "ykKuyrukGonder": return ykKuyrukGonder(true);
    case "ykRapor": { const gs = t => { const d = new Date(t); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
      SB.rapor = SB.rapor || { bas: gs(Date.now() - 29 * 864e5), son: bugunStr(), sube: "", veri: null }; return ciz(); }
    case "ykRaporKapat": SB.rapor = null; return ciz();
    case "ykRaporGoster": {
      Object.assign(SB.rapor, { bas: app.querySelector("#yrBas").value, son: app.querySelector("#yrSon").value, sube: app.querySelector("#yrSube").value });
      try { SB.rapor.veri = await yukle(() => run("yoklamaRaporu", kim, { bas: SB.rapor.bas, son: SB.rapor.son, sube: SB.rapor.sube })); } catch (e) { alert(e.message); }
      return ciz();
    }
    case "ykRaporIndir": {
      const r = SB.rapor;
      return csvIndir(`yoklama-${r.sube || "tum"}-${r.bas || "basi"}_${r.son || "sonu"}.csv`,
        [["Öğrenci", "Şube", "Var", "Yok", "Geç", "İzinli", "Toplam ders", "Devamsızlık %", "Son yok"]].concat(r.veri.satirlar.map(x =>
          [x.ad, x.sube, x.var, x.yok, x.gec, x.izinli, x.toplam, x.toplam ? Math.round(100 * x.yok / x.toplam) : 0, x.sonYok])));
    }
    case "odevYeni": { const kal = SB.veri.kaldigi[SB.ders]; SB.form = { konu: kal ? konuYazi(kal) : "", aciklama: "", teslim: "" }; SB.mod = "odevForm"; return ciz(); }
    case "odKonuSec": {
      SB.form.aciklama = app.querySelector("#odAck").value; SB.form.teslim = app.querySelector("#odTeslim").value; SB.form.konu = app.querySelector("#odKonu").value;
      const k = await konuSecModal(SB.ders); if (k) SB.form.konu = konuYazi(k); return ciz();
    }
    case "odevKaydet": {
      const f = { sube: SB.secili, ders: SB.ders, konu: app.querySelector("#odKonu").value.trim(), aciklama: app.querySelector("#odAck").value.trim(), teslim: app.querySelector("#odTeslim").value };
      if (!f.konu && !f.aciklama) return alert("Ödevin konusunu ya da açıklamasını yazın.");
      SB.form = f; return sbIslem("odevVer", f);
    }
    case "odevAc": SB.odev = b.dataset.id; SB.mod = "odev"; return ciz();
    case "odD": {
      const o = SB.veri.odevler.find(x => x.id === SB.odev); if (!o) return;
      const ad = b.dataset.o, onceki = o.durum[ad];
      const yeni = onceki && onceki.d === b.dataset.d ? "" : b.dataset.d; // aynı düğmeye tekrar: işareti kaldır
      if (yeni) o.durum[ad] = { d: yeni, kim: V.ben || "Rehberlik" }; else delete o.durum[ad];
      ciz(); mesgul(1);
      try { const x = await run("odevIsaretle", kim, o.id, ad, yeni); if (x.durum) o.durum[ad] = { d: x.durum, kim: x.onaylayan }; }
      catch (e) { if (onceki) o.durum[ad] = onceki; else delete o.durum[ad]; alert(e.message); }

      return;
    }
    case "odevSil": {
      const o = SB.veri.odevler.find(x => x.id === SB.odev);
      if (!o || !(await onay(`<b>${esc(o.konu || o.aciklama)}</b><br>Ödev ve öğrenci işaretleri silinsin mi?`, "🗑 Evet, sil"))) return;

    }
  }
}

    case "gkonuGoster": return konuRaporYukle();
    case "sirasiz": return sirasizAc();
    case "gtAralik": gt.aralik = b.dataset.k; if (gt.aralik === "tarih") { if (!gt.bas) gt.bas = gt.son = bugunStr(); return ciz(); } return tabloYukle();
    case "gtGoster": gt.bas = app.querySelector("#gtbas").value || bugunStr(); gt.son = app.querySelector("#gtson").value || gt.bas; if (gt.son < gt.bas) [gt.bas, gt.son] = [gt.son, gt.bas]; return tabloYukle();
    case "gtSirala": gt.sirala = b.dataset.k; return ciz();
    case "gtIndir": return tabloIndir();
    case "gdersGoster": return dersGecmisYukle();
    case "gsec": return ogrGecmisYukle({ ad: b.dataset.s, sinif: b.dataset.c });
    case "gTemizle": return gecmisTemizle();
  }
  const arg = { id: b.dataset.id, ders: b.dataset.d, ogretmen: ben };
  if (a === "iptal") {
    const k = V.kayitlar.find(x => x.id === b.dataset.id);
    if (!(await onay(`<b>${esc(k ? k.ogrenci : "")}</b> · ${esc(k ? k.ders : "")}<br>Sıradan çıkarılsın mı?`, "Evet, çıkar"))) return;
  }
  if (a === "bitti") {
    const k = V.kayitlar.find(x => x.id === b.dataset.id);
    const c = await cozulduSor(k);
    if (!c) return;
    if (c.konu) arg.konu = c.konu;
  }
  if (a === "devret") {
    const uygun = V.ogretmenler.filter(o => o !== ben && (rol === "rehber" || (V.ogretmenDers[o] || []).includes(b.dataset.d)));
    if (!uygun.length) return alert("Bu dersi veren başka öğretmen yok.");
    const ad = await secim("Kime devredilsin?", uygun);
    if (!ad) return; arg.yeni = ad;
  }
  if (a === "kutuListe") return kutuListe(b.dataset.k);
  if (a === "buCagir") return seciliCagir(b.dataset.id, b);
  if (!["cagir","bitti","geri","sonaAt","iptal","devret"].includes(a)) return;
  if (a === "cagir") {
    // Kimin geleceğini sunucu belirler: sadece bu düğme beklesin, ekran kilitlenmesin
    if (b.classList.contains("bekle")) return;
    b.classList.add("bekle"); mesgul(1);
    try { V = await run("islem", kim, a, arg); mesaj = V.mesaj; veriSakla(); }
    catch(err) { alert(err.message); arkaYenile(); }
    finally { mesgul(-1); }
    return ciz();
  }
  // Çözüldü, geri, sona at, çıkar, devret: ekranda hemen uygula, kaydı arka planda yap
  const k = V.kayitlar.find(x => x.id === arg.id);
  const onceki = k ? { durum: k.durum, ogretmen: k.ogretmen, baslama: k.baslama, sira: k.sira, oncelik: onc(k) } : null;
  if (k) {
    const t = Date.now();
    if (a === "bitti") Object.assign(k, { durum: "cozuldu", bitis: t }, arg.konu ? { konu: konuYazi(arg.konu) } : {});
    if (a === "geri") Object.assign(k, { durum: "bekliyor", ogretmen: "", baslama: 0 });
    if (a === "sonaAt") Object.assign(k, { durum: "bekliyor", ogretmen: "", baslama: 0, sira: t, oncelik: 2 });
    if (a === "iptal") Object.assign(k, { durum: "iptal", bitis: t });
    if (a === "devret") k.ogretmen = arg.yeni;
    mesaj = { bitti: "✔ Kaydedildi.", geri: "Sıraya geri kondu.", sonaAt: "Sıranın sonuna alındı.", iptal: "Sıradan çıkarıldı.", devret: arg.yeni + " öğretmene devredildi." }[a];
    ciz();
  }
  mesgul(1);
  const is = run("islem", kim, a, arg);
  if (k && ["bitti", "iptal", "sonaAt"].includes(a)) geriAlGoster(`${k.ogrenci}: ${{ bitti: "çözüldü", iptal: "sıradan çıkarıldı", sonaAt: "sona alındı" }[a]}`, k.id, onceki, is);
  try { const v = await is; if (arkada === 1) { V = v; mesaj = v.mesaj; veriSakla(); ciz(); } }
  catch(err) { alert(err.message + "\n\nEkran yenileniyor."); arkaYenile(); }
  finally { mesgul(-1); }
});
/* Ekranı kilitlemeden sunucudan güncel veriyi al */

/* Çözüldü onayı: isteğe bağlı olarak dersin konu listesinden konu seçilir (rehberliğin konu raporu için) */
async function cozulduSor(k){
  let konu = null;
  for (;;) {
    const c = await new Promise(res => {
      const m = document.getElementById("modal");
      m.innerHTML = `<div class="modal"><div class="card"><h3 style="font-weight:600;line-height:1.5"><b>${esc(k ? k.ogrenci : "")}</b> · ${esc(k ? k.ders : "")}<br>Soru çözüldü olarak işaretlensin mi?</h3>
        <label style="margin-top:4px">Sorunun konusu (isteğe bağlı)</label>
        <button class="btn gh" style="width:100%;justify-content:flex-start;text-align:left" data-y="konu">📍 ${konu ? esc(konuYazi(konu)) : "Konu seç"}</button>
        <button class="btn ok big" data-y="1">✔ Evet, çözüldü</button><button class="btn gh big" style="margin-top:8px" data-y="">Vazgeç</button></div></div>`;
      m.onclick = e => { const b = e.target.closest("[data-y]"); if (!b) return; m.innerHTML = ""; res(b.dataset.y); };
    });
    if (c === "konu") { const s = k ? await konuSecModal(k.ders, {}) : null; if (s) konu = s; continue; }
    return c === "1" ? { konu: konu } : null;
  }
}
function onay(metin, evet){
  return new Promise(res => {
    const m = document.getElementById("modal");
    m.innerHTML = `<div class="modal"><div class="card"><h3 style="font-weight:600;line-height:1.5">${metin}</h3>
      <button class="btn ok big" data-y="1">${esc(evet)}</button><button class="btn gh big" style="margin-top:8px" data-y="">Vazgeç</button></div></div>`;
    m.onclick = e => { const b = e.target.closest("[data-y]"); if (!b) return; m.innerHTML = ""; res(!!b.dataset.y); };
  });
}
function cokluSecim(soru, liste, secili){
  return new Promise(res => {
    const sec = new Set(secili || []);
    const m = document.getElementById("modal");
    m.innerHTML = `<div class="modal"><div class="card"><h3 style="font-weight:600;line-height:1.5">${soru}</h3>
      <div class="chips">${liste.map(x => `<button class="chip ${sec.has(x) ? "on" : ""}" data-c="${esc(x)}">${esc(x)}</button>`).join("")}</div>
      <button class="btn ok big" data-y="1">Kaydet</button><button class="btn gh big" style="margin-top:8px" data-y="">Vazgeç</button></div></div>`;
    m.onclick = e => {
      const c = e.target.closest("[data-c]");
      if (c) { sec.has(c.dataset.c) ? sec.delete(c.dataset.c) : sec.add(c.dataset.c); c.classList.toggle("on"); return; }
      const b = e.target.closest("[data-y]"); if (!b) return;
      m.innerHTML = ""; res(b.dataset.y ? liste.filter(x => sec.has(x)) : null);
    };
  });
}
function metinSor(soru){
  return new Promise(res => {
    const m = document.getElementById("modal");
    m.innerHTML = `<div class="modal"><div class="card"><h3 style="font-weight:600;line-height:1.5">${soru}</h3>
      <input id="msor" type="text" inputmode="numeric" autocomplete="off" style="text-align:center;font-size:22px">
      <button class="btn ok big" data-y="1">Kaydet</button><button class="btn gh big" style="margin-top:8px" data-y="">Vazgeç</button></div></div>`;
    const inp = m.querySelector("#msor"); inp.focus();
    m.onclick = e => { const b = e.target.closest("[data-y]"); if (!b) return; const v = inp.value.trim(); m.innerHTML = ""; res(b.dataset.y ? v : null); };
  });
}
function secim(soru, liste){
  return new Promise(res => {
    const m = document.getElementById("modal");
    m.innerHTML = `<div class="modal"><div class="card"><h3>${esc(soru)}</h3><div class="chips">${liste.map(x => `<button class="chip" data-x="${esc(x)}">${esc(x)}</button>`).join("")}</div>
      <button class="btn gh big" data-x="">Vazgeç</button></div></div>`;
    m.onclick = e => { const b = e.target.closest("[data-x]"); if (!b) return; m.innerHTML = ""; res(b.dataset.x || null); };
  });
}

/* ================= 📱 UYGULAMA: otomatik güncelleme · bildirim · rozet =================
   Sadece GitHub Pages sürümünde çalışır (data-api dolu). Apps Script içindeki eski linkte hiçbiri devreye girmez. */
/* Mağaza uygulaması (Capacitor, Android/iOS): ekran uygulamanın içinden açılır; bildirimi yerel eklenti verir,
   güncelleme mağazadan gelir (service worker ve sürüm yoklaması kapalı). */
const NATIVE = !!(window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform());
const FBN = NATIVE && Capacitor.Plugins ? Capacitor.Plugins.FirebaseMessaging : null;
const SURUM = NATIVE ? "" : document.body.dataset.surum || "";
let FB = null;
try { FB = JSON.parse(document.body.dataset.fb || "null"); } catch (e) {}
if (!FB || !FB.apiKey || !FB.vapidKey) FB = null;
const swVar = !!API && !NATIVE && "serviceWorker" in navigator;
let swKayit = null;
if (swVar) {
  navigator.serviceWorker.register("sw.js").then(r => { swKayit = r; }).catch(() => {});
  // Bildirim geldiğinde açık ekran kendini tazeler
  navigator.serviceWorker.addEventListener("message", e => {
    const d = e.data || {};
    if (d.tip !== "bildirim" || !kim || !V) return;
    if (d.tikla && d.tur === "birebir" && rol === "ogretmen") { arkaYenile().then(() => { if ((V.birebir || []).length) zilAc(); }); return; }
    if (!arkada) arkaYenile();
  });
}
/* Yeni sürüm yayınlandıysa sayfa uygun bir anda kendini yeniler (açık modal, yazılan alan, süren işlem yokken) */
let yeniSurum = "";
const rahat = () => !arkada && !document.querySelector(".modal") && !app.classList.contains("yuk") &&
  !(document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName));
async function surumKontrol(){
  if (!SURUM) return;
  if (!yeniSurum) {
    try {
      const j = await fetch("surum.json?t=" + Date.now(), { cache: "no-store" }).then(r => r.json());
      if (j && j.surum && j.surum !== SURUM) yeniSurum = j.surum;
    } catch (e) { return; }
  }
  if (!yeniSurum || !rahat()) return;
  // Aynı sürüm için kısa sürede ikinci kez yenileme (GitHub önbelleği eskiyi verirse döngü olmasın)
  const g = ls.get("guncelleme");
  if (g && g.surum === yeniSurum && Date.now() - g.t < 15 * 60000) return;
  ls.set("guncelleme", { surum: yeniSurum, t: Date.now() });
  location.replace(location.pathname + "?v=" + yeniSurum + location.hash); // yeni adres: GitHub önbelleğini de atlar
}
if (SURUM) {
  setInterval(surumKontrol, 120000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) surumKontrol(); });
  setTimeout(surumKontrol, 5000);
}
/* Uygulama simgesinde bekleyen öğrenci sayısı (destekleyen telefonlarda) */
function rozet(n){
  if (!API || NATIVE) return;
  try { const p = n ? navigator.setAppBadge && navigator.setAppBadge(n) : navigator.clearAppBadge && navigator.clearAppBadge(); if (p && p.catch) p.catch(() => {}); } catch (e) {}
}
/* ---------- 🔔 Bildirimler (Firebase Cloud Messaging) ---------- */
const FB_SURUM = "12.15.0";
const iosMu = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const anaEkranda = () => NATIVE || (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
const bildirimDestek = () => NATIVE ? !!FBN : !!(FB && swVar && "Notification" in window && "PushManager" in window);
const izinVar = () => NATIVE || (typeof Notification !== "undefined" && Notification.permission === "granted");
const bildirimAcik = () => { const b = ls.get("fcm"); return !!(b && kim && b.ad === kim.ad && izinVar()); };
const cihazAdi = () => NATIVE ? (Capacitor.getPlatform() === "ios" ? "iOS uygulaması" : "Android uygulaması") : (iosMu ? "iPhone/iPad" : /Android/.test(navigator.userAgent) ? "Android" : "Bilgisayar") + (anaEkranda() ? " · uygulama" : " · tarayıcı");
/* Bildirim önerisi görünsün mü? (iPhone'da ana ekrana eklenmemişse nasıl yapılacağını anlatır) */
function bildirimOner(){
  if (NATIVE) return !!(FBN && kim && !bildirimAcik() && !ls.get("fcmRed"));
  if (!FB || !kim || bildirimAcik()) return false;
  if (typeof Notification !== "undefined" && Notification.permission === "denied") return false;
  return bildirimDestek() || (iosMu && !anaEkranda());
}
let fbMesaj = null;
async function fcmToken(){
  if (NATIVE) {
    const r = await FBN.requestPermissions();
    if (r.receive !== "granted") { ls.set("fcmRed", 1); throw new Error("IZIN_YOK"); }
    if (Capacitor.getPlatform() === "android") await FBN.createChannel({ id: "soru", name: "Soru sırası", importance: 5, sound: "default" }).catch(() => {});
    return (await FBN.getToken()).token;
  }
  const b = "https://www.gstatic.com/firebasejs/" + FB_SURUM + "/";
  const [a, m] = await Promise.all([import(b + "firebase-app.js"), import(b + "firebase-messaging.js")]);
  if (!fbMesaj) fbMesaj = m.getMessaging(a.getApps().length ? a.getApp() : a.initializeApp(FB));
  const reg = swKayit || (swKayit = await navigator.serviceWorker.register("sw.js"));
  return m.getToken(fbMesaj, { vapidKey: FB.vapidKey, serviceWorkerRegistration: reg });
}
function bilgiKutusu(html){
  const m = document.getElementById("modal");
  m.innerHTML = `<div class="modal"><div class="card"><div style="line-height:1.6">${html}</div><button class="btn ok big" style="margin-top:14px" data-y="1">Tamam</button></div></div>`;
  m.onclick = e => { if (e.target.closest("[data-y]")) m.innerHTML = ""; };
}
async function bildirimAc(){
  if (iosMu && !anaEkranda()) return bilgiKutusu(`<h3 style="margin-top:0">📲 Önce ana ekrana ekleyin</h3>
    iPhone'da bildirim yalnızca ana ekrandaki uygulamaya gelir:<br><br>
    1) Safari'de <b>Paylaş</b> düğmesine (⬆️) dokunun<br>2) <b>Ana Ekrana Ekle</b>'yi seçin<br>
    3) Ana ekrandaki <b>Soru ve Ödev Takip</b> simgesinden açın, gerekirse yeniden giriş yapın<br>4) Çıkan <b>🔔 Bildirimleri aç</b> düğmesine dokunun`);
  if (!bildirimDestek()) return alert("Bu tarayıcı bildirimleri desteklemiyor. Chrome ya da Safari ile deneyin.");
  let izin = "granted"; // uygulamada izni fcmToken() ister
  if (!NATIVE) try { izin = await Notification.requestPermission(); } catch (e) { izin = "denied"; } // dokunuşun hemen ardından sorulmalı (iPhone)
  if (izin !== "granted") return alert("Bildirim izni verilmedi. İsterseniz telefonun Ayarlar → Bildirimler bölümünden Soru ve Ödev Takip'e izin verebilirsiniz.");
  mesgul(1);
  try {
    const t = await fcmToken();
    if (!t) throw new Error("Telefon bildirim anahtarı vermedi.");
    const r = await run("bildirimKaydet", kim, t, cihazAdi());
    ls.set("fcm", { ad: kim.ad, token: t, gun: bugunStr() });
    mesaj = r.gonderilebilir ? "🔔 Bildirimler açıldı. Deneme bildirimi gönderildi." : "🔔 Bildirimler açıldı (sunucu tarafı kurulunca gelmeye başlayacak).";
    if (r.gonderilebilir) run("bildirimDene", kim).catch(() => {});
    ciz();
  } catch (e) {
    alert(e.message === "IZIN_YOK" ? "Bildirim izni verilmedi. Telefonun Ayarlar → Uygulamalar → Soru ve Ödev Takip → Bildirimler bölümünden açabilirsiniz." : "Bildirimler açılamadı: " + e.message);
    if (e.message === "IZIN_YOK") ciz();
  }
  finally { mesgul(-1); }
}
/* Günde bir kez: bildirim anahtarı değiştiyse sunucuya yeniden bildir */
async function bildirimTazele(){
  const b = ls.get("fcm");
  if (!b || !kim || b.ad !== kim.ad || b.gun === bugunStr() || !bildirimDestek() || !izinVar()) return;
  try {
    const t = await fcmToken();
    if (!t) return;
    await run("bildirimKaydet", kim, t, cihazAdi());
    if (b.token && b.token !== t) run("bildirimSil", b.token, KURUM ? KURUM.kod : "").catch(() => {});
    ls.set("fcm", { ad: kim.ad, token: t, gun: bugunStr() });
  } catch (e) {}
}
/* Ekranın üstünde bildirim önerisi; "Sonra" denirse 3 gün sorulmaz (başlıktaki 🔕 durur) */
function bildirimSerit(){
  if (!bildirimOner()) return "";
  const s = ls.get("fcmSonra");
  if (s && Date.now() - s < 3 * 86400000) return "";
  const ios = iosMu && !anaEkranda();
  return `<div class="card serit" style="display:flex;gap:10px;align-items:center;padding:12px 14px;border-left:4px solid #1E3A8A">
    <span style="font-size:24px">🔔</span><div class="sp" style="flex:1"><b>${rol === "rehber" ? "Uzun bekleyen öğrenci olunca haber alın" : "Sıranıza öğrenci gelince haber alın"}</b>
    <div class="mute" style="font-size:13px">${ios ? "iPhone'da önce ana ekrana eklemeniz gerekiyor." : "Telefonunuza bildirim gelir."}</div></div>
    <button class="btn sm" data-bd="ac">${ios ? "Nasıl?" : "Aç"}</button><button class="btn sm gh" data-bd="sonra">Sonra</button></div>`;
}
/* Uygulamada: bildirim gelince ekranı tazele; bildirime dokununca birebir listesini aç */
if (NATIVE && FBN) {
  FBN.addListener("notificationReceived", () => { if (kim && V && !arkada) arkaYenile(); });
  FBN.addListener("notificationActionPerformed", e => {
    const tur = (((e || {}).notification || {}).data || {}).tur;
    if (!kim || !V) return;
    arkaYenile().then(() => { if (tur === "birebir" && rol === "ogretmen" && (V.birebir || []).length) zilAc(); });
  });
}
app.addEventListener("click", e => {

  e.preventDefault(); e.stopPropagation();
  if (b.dataset.bd === "ac") return bildirimAc();
  ls.set("fcmSonra", Date.now()); ciz();

/* ================= BAŞLAT ================= */
if (!API && (typeof google === "undefined" || !google.script)) {
  app.innerHTML = `<div class="card dar msg bad">Bu dosya doğrudan açılmaz.<br><br>Apps Script'te <b>Dağıt → Yeni dağıtım → Web uygulaması</b> yapıp size verilen <b>…/exec</b> ile biten linki açın.</div>`;
} else if (P === "ogretmen") {
  ogretmen();
  setInterval(() => { if (kim && V && (sekme === "sira" || sekme === "bugun") && !arkada && !document.querySelector(".modal") && !app.classList.contains("yuk") && !document.hidden) ogretmen(); }, 20000);
} else {

    <p class="mute" style="margin-top:16px">Öğretmen ve rehberlik girişi: ${link("ogretmen", "buradan")}</p></div>`;
}
