@keyframes akis{to{background-position:-200% 0}}
.hide{display:none!important}
.tv .row{font-size:20px}.tv .no{font-size:20px}
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}

.sug div:last-child{border-bottom:0}
.sug div:hover{background:#e8edf8}
.liste{max-height:420px;overflow:auto}
.tabs{display:flex;gap:8px;margin-bottom:12px}

/* Uygulamada sayfa saat/pil şeridinin altına uzanır (viewport-fit=cover): üst çubuk güvenli alandan başlasın,
   yoksa Çıkış düğmesine dokunulamaz. Android (Capacitor 8) değerleri --safe-area-inset-* ile verir. */
header{padding-top:calc(10px + max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px)));
  padding-left:calc(16px + max(env(safe-area-inset-left,0px),var(--safe-area-inset-left,0px)));
  padding-right:calc(16px + max(env(safe-area-inset-right,0px),var(--safe-area-inset-right,0px)))}
main{padding:16px 14px calc(40px + max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px)))}

.card{border:0;border-radius:20px;box-shadow:0 1px 2px #0000000a,0 8px 24px #1d24330f}

/* ---------- Modern düğmeler (Kasım 2026) ----------
   Düz renk, ince gölge, 44px dokunma alanı, klavye odağı halkası. Ana renk pembe, ikincil düğmeler beyaz kenarlıklı.
   Sekmeler iOS tarzı bölümlü denetim: seçili sekme beyaz kart. */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:12px;border:1px solid transparent;
  font-weight:700;font-size:15.5px;letter-spacing:.1px;line-height:1.2;text-align:center;-webkit-tap-highlight-color:transparent;
  transition:background .15s,border-color .15s,box-shadow .15s,transform .08s,color .15s}
.btn:active{transform:translateY(1px) scale(.99)}
.btn:not(.gh):not(.bad):not(.warn):not(.ok){background:var(--pri);color:#fff;box-shadow:0 1px 2px #be185d40,inset 0 1px 0 #ffffff2e}
.btn:not(.gh):not(.bad):not(.warn):not(.ok):hover{background:#c81e6c}
.btn.ok:not(.gh):not(.bad):not(.warn){background:#16a34a;color:#fff;box-shadow:0 1px 2px #15803d40,inset 0 1px 0 #ffffff2e}
.btn.ok:not(.gh):not(.bad):not(.warn):hover{background:#15803d}
.btn.bad{background:#dc2626;color:#fff;box-shadow:0 1px 2px #b91c1c40,inset 0 1px 0 #ffffff2e}.btn.bad:hover{background:#b91c1c}
.btn.warn{background:#d97706;color:#fff;box-shadow:0 1px 2px #b4530940}.btn.warn:hover{background:#b45309}
.btn.gh{background:#fff;color:#1e293b;border-color:#e2e8f0;box-shadow:0 1px 2px #0f172a0d}
.btn.gh:hover{background:#f8fafc;border-color:#cbd5e1}
.btn.big{min-height:52px;padding:14px 18px;font-size:17px;border-radius:14px}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:10px;gap:6px}
.btn:disabled,.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none!important}
.btn:focus-visible,.chip:focus-visible,.seg button:focus-visible,.giris-btn:focus-visible,.rehber-btn:focus-visible,.sube-btn:focus-visible,.konu-btn:focus-visible,header a:focus-visible{
  outline:none;box-shadow:0 0 0 2px #fff,0 0 0 4px #db2777aa!important}
.tabs{background:#eef1f6;padding:4px;border-radius:14px;box-shadow:none;gap:2px}
.tabs .btn{min-height:42px;border-radius:10px;font-weight:700;border:0}
.tabs .btn.gh{background:transparent;color:#64748b;box-shadow:none}
.tabs .btn.gh:hover{background:#ffffff99;color:#334155}
.tabs .btn:not(.gh):not(.bad):not(.warn):not(.ok){background:#fff;color:var(--pri);box-shadow:0 1px 3px #0f172a1f,0 1px 1px #0f172a0a}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:8px 14px;border:1px solid #e2e8f0;border-radius:999px;background:#fff;
  font-size:15px;font-weight:600;color:#1e293b;transition:background .15s,border-color .15s,color .15s}
.chip:hover{background:#f8fafc;border-color:#cbd5e1}
.chip.on:not(.kchip){background:#fdf2f8;border-color:var(--pri);color:#9d174d;font-weight:700}

    </div></div>`;
    m.onclick = tik; // onay penceresi kendi işleyicisini koyar; her çizimde geri al
    const inp = m.querySelector("#sad"), kutu = m.querySelector("#ssug");
    aramaBagla(inp, kutu, "sSec");
    inp.addEventListener("input", () => { secilen = null; m.dataset.yazi = inp.value; });

  };
  const kaydet = async listeDisi => {

      if (e.message === "LISTEDE_YOK") {

        if (await onay(`<b>${esc(ad)}</b> öğrenci listesinde yok.<br>Yine de bu adla kaydedilsin mi?<br><span class="mute" style="font-size:14px">İsterseniz rehberlik sonra öğrenci listesine ekleyebilir.</span>`, "✔ Evet, kaydet")) return kaydetDis(ad, notu);
        return ciz_();
      }
      ciz_(e.message);
    } finally { mesgul(-1); }
  };
  const kaydetDis = async (ad, notu) => {

    try { V = await run("sirasizCozum", kim, { ad: ad, ders: ders, notu: notu, listeDisi: true, ogretmen: ben }); mesaj = V.mesaj; veriSakla(); m.dataset.yazi = ""; ciz(); }

/* Sıranın istediği yerinden çağır (adına dokununca ya da listeden) */
async function seciliCagir(id, b){
  const k = V.kayitlar.find(x => x.id === id); if (!k) return;
  if (k.mesgul) return alert(k.ogrenci + " şu an başka bir öğretmende. Önce o öğretmenin işi bitmeli.");
  const sira = V.kayitlar.filter(x => x.durum === "bekliyor" && x.ders === k.ders && siraKarsilastir(x, k) < 0).length + 1;
  if (!(await onay(`<b>${esc(k.ogrenci)}</b> şimdi çağrılsın mı?<br><span class="mute" style="font-size:14px">${ikon(k.ders)} ${esc(k.ders)} · sırada ${sira}. kişi</span>`, "📣 Evet, çağır"))) return;
  if (b && b.classList.contains("bekle")) return;
  if (b) b.classList.add("bekle");
  mesgul(1);
  try { V = await run("islem", kim, "cagir", { ogretmen: ben, ders: k.ders, id: k.id }); mesaj = V.mesaj; veriSakla(); }
  catch (err) { alert(err.message); arkaYenile(); }
  finally { mesgul(-1); }
  ciz();
}
/* Üstteki kutulara dokununca: bekleyenler / bugün çözdüklerim listesi; "şu an benimle" o karta kaydırır */
function kutuListe(tur){
  if (tur === "benim") { const c = [...app.querySelectorAll("h2")].find(h => /Şu an benimle/.test(h.textContent)); if (c) c.closest(".card").scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  const t = { ad: ben }, simdi = V.simdi || Date.now(), K = V.kayitlar;
  const atanmis = rol === "ogretmen";
  const secili = derslerim.filter(d => V.dersler.includes(d));
  const dersler = atanmis ? V.benimDerslerim : (secili.length ? secili : V.dersler);
  const bekleyen = d => K.filter(k => k.durum === "bekliyor" && k.ders === d).sort(siraKarsilastir);
  let baslik, govde;
  if (tur === "bekleyen") {
    const gruplar = dersler.map(d => [d, bekleyen(d)]).filter(([, l]) => l.length);
    const toplam = gruplar.reduce((n, [, l]) => n + l.length, 0);
    baslik = `⏳ Bekleyenler (${toplam})`;
    govde = gruplar.length ? gruplar.map(([d, l]) => `<div style="margin-top:8px"><b>${ikon(d)} ${esc(d)}</b> <span class="mute">· ${l.length} kişi</span></div>` + l.map((k, i) =>
      `<div class="liste-satir"><span class="sira-no">${i + 1}</span>${avatar(k.ogrenci)}<div class="sp"><b>${esc(k.ogrenci)}</b><div class="mute" style="font-size:13px">No ${k.no}${oncelikEtiket(k)}${k.notu ? " · 📝 " + esc(k.notu) : ""}${k.mesgul ? " · ⏳ başka öğretmende" : ""}</div></div>
        ${sureEt(dk(k.eklendi, simdi))}${k.mesgul ? "" : `<button class="btn sm ok" data-lc="${esc(k.id)}" title="Çağır">📣</button>`}</div>`).join("")).join("")
      : '<div class="bos"><i>🎉</i>Bekleyen öğrenci yok.</div>';
  } else {
    const l = K.filter(k => k.durum === "cozuldu" && k.ogretmen === t.ad).sort((a, b) => (b.bitis || 0) - (a.bitis || 0));
    const sureler = l.filter(k => k.baslama && k.bitis > k.baslama).map(k => (k.bitis - k.baslama) / 60000);
    baslik = `✔ Bugün çözdüklerim (${l.length})`;
    govde = l.length ? (sureler.length ? `<p class="mute" style="margin-top:-4px">Ortalama ${Math.max(1, Math.round(sureler.reduce((a, b) => a + b, 0) / sureler.length))} dk</p>` : "") + l.map(k =>
      `<div class="liste-satir"><span class="mute" style="min-width:44px;font-weight:800">${saat(k.bitis)}</span>${avatar(k.ogrenci)}<div class="sp"><b>${esc(k.ogrenci)}</b>
        <div class="mute" style="font-size:13px">${ikon(k.ders)} ${esc(k.ders)}${k.baslama && k.bitis > k.baslama ? ` · ${Math.max(1, Math.round((k.bitis - k.baslama) / 60000))} dk` : ""}${/sırasız/.test(k.kaydeden || "") ? " · sırasız" : ""}${k.notu && k.notu !== "Sırasız çözüm" ? " · 📝 " + esc(k.notu) : ""}</div></div></div>`).join("")
      : '<div class="bos"><i>🌱</i>Bugün henüz çözdüğünüz soru yok.</div>';
  }
  const m = document.getElementById("modal");
  m.innerHTML = `<div class="modal"><div class="card" style="max-height:85vh;overflow:auto"><h3 style="font-weight:800;margin-top:0">${baslik}</h3>${govde}
    <button class="btn gh big" data-y="" style="margin-top:12px">Kapat</button></div></div>`;
  m.onclick = e => {
    const c = e.target.closest("[data-lc]"); if (c) { m.innerHTML = ""; return seciliCagir(c.dataset.lc); }
    if (e.target.closest("[data-y]") || e.target.classList.contains("modal")) m.innerHTML = "";
  };
}

/* ================= 📊 BUGÜN (rehberlik) ================= */
const ort = l => l.length ? Math.round(l.reduce((a, b) => a + b, 0) / l.length / 60000) : null;
const dkYaz = m => m == null ? "–" : m + " dk";
/* Bir dersin bugünkü ortalama çözüm süresi (dk); veri azsa 5 dk varsayılır */
function cozumSure(d, v){
  const l = v.kayitlar.filter(k => k.ders === d && k.durum === "cozuldu" && k.baslama && k.bitis > k.baslama).map(k => k.bitis - k.baslama);
  return l.length >= 2 ? Math.max(1, ort(l)) : 5;
}
function tahminYaz(d, onunde, v){
  const hoca = new Set(v.kayitlar.filter(k => k.ders === d && k.ogretmen && k.durum !== "iptal").map(k => k.ogretmen)).size || 1;
  return ` · tahmini bekleme ≈ ${Math.max(1, Math.round(onunde * cozumSure(d, v) / hoca))} dk`;
}
function bugunCiz(){
  const K = V.kayitlar, simdi = V.simdi || Date.now();
  const bekl = k => k.baslama ? k.baslama - k.eklendi : null;
  const dersler = V.dersler.filter(d => K.some(k => k.ders === d));
  const hocalar = [...new Set(K.filter(k => k.ogretmen && k.durum !== "iptal" && k.ogretmen !== "(gün sonu)").map(k => k.ogretmen))]
    .map(o => ({ ad: o, coz: K.filter(k => k.ogretmen === o && k.durum === "cozuldu"), simdi: K.filter(k => k.ogretmen === o && k.durum === "cozuluyor").length }))
    .sort((a, b) => b.coz.length - a.coz.length);
  const cozulen = K.filter(k => k.durum === "cozuldu").length, bekleyen = K.filter(k => k.durum === "bekliyor").length;
  const enUzun = K.filter(k => k.durum === "bekliyor").sort((a, b) => a.eklendi - b.eklendi)[0];
  app.innerHTML = sekmeler() + msgHtml() + `
  <div class="ozet">
    <div class="kutu"><b style="color:#1E3A8A">${new Set(K.map(k => k.ogrenci)).size}</b><span>öğrenci geldi</span></div>
    <div class="kutu"><b style="color:#DB2777">${cozulen}</b><span>soru çözüldü</span></div>
    <div class="kutu"><b style="color:#d97706">${bekleyen}</b><span>şu an bekliyor</span></div>
  </div>
  ${enUzun ? `<div class="card"><b>⏳ En uzun bekleyen:</b> ${esc(enUzun.ogrenci)} · ${ikon(enUzun.ders)} ${esc(enUzun.ders)} · ${sureEt(dk(enUzun.eklendi, simdi))}</div>` : ""}
  <div class="card"><div class="flex"><h2 style="margin:0">Dersler</h2><span class="sp"></span><button class="btn sm gh" data-a="yenile">↻ Yenile</button></div>
    ${dersler.length ? `<table class="rapor"><tr><th>Ders</th><th class="s">Bekleyen</th><th class="s">Çözülen</th><th class="s">Ort. bekleme</th><th class="s">Ort. çözüm</th></tr>
    ${dersler.map(d => { const l = K.filter(k => k.ders === d);
      return `<tr><td>${ikon(d)} <b>${esc(d)}</b></td><td class="s">${l.filter(k => k.durum === "bekliyor").length}</td><td class="s">${l.filter(k => k.durum === "cozuldu").length}</td>
        <td class="s">${dkYaz(ort(l.map(bekl).filter(x => x != null && x >= 0)))}</td><td class="s">${dkYaz(ort(l.filter(k => k.durum === "cozuldu" && k.bitis > k.baslama).map(k => k.bitis - k.baslama)))}</td></tr>`; }).join("")}</table>`
    : '<div class="bos"><i>🌱</i>Bugün henüz kayıt yok.</div>'}</div>
  ${hocalar.length ? `<div class="card"><h2>Öğretmenler</h2><table class="rapor"><tr><th>Öğretmen</th><th class="s">Çözülen</th><th class="s">Ort. çözüm</th><th class="s">Şu an</th></tr>
    ${hocalar.map(h => `<tr><td>${avatar(h.ad)} ${esc(h.ad)}</td><td class="s"><b>${h.coz.length}</b></td><td class="s">${dkYaz(ort(h.coz.filter(k => k.bitis > k.baslama).map(k => k.bitis - k.baslama)))}</td><td class="s">${h.simdi ? "🟢 " + h.simdi : "–"}</td></tr>`).join("")}</table></div>` : ""}`;
}

let toastZaman = null;
function geriAlGoster(metin, id, onceki, bekleyenIs){
  const t = document.getElementById("toast");
  document.getElementById("toastY").textContent = metin;
  t.classList.add("on");
  clearTimeout(toastZaman);
  toastZaman = setTimeout(() => t.classList.remove("on"), 7000);
  document.getElementById("toastB").onclick = async () => {
    clearTimeout(toastZaman); t.classList.remove("on");
    const k = V.kayitlar.find(x => x.id === id);
    if (k) { Object.assign(k, onceki, { bitis: 0 }); mesaj = "Geri alındı."; ciz(); }
    mesgul(1);
    try {
      await bekleyenIs.catch(() => {});           // önce asıl işlem sunucuda bitsin
      const v = await run("islem", kim, "geriAl", { id: id, onceki: onceki, ogretmen: ben });
      if (arkada === 1) { V = v; veriSakla(); ciz(); }
    } catch (err) { alert(err.message); arkaYenile(); }
    finally { mesgul(-1); }
  };
}

  const u = URL.createObjectURL(new Blob(["\ufeff" + satirlar.map(r => r.map(h).join(";")).join("\r\n")], { type: "text/csv;charset=utf-8" }));
  const a = document.createElement("a");
  a.href = u; a.download = ad;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000);
}

const devamRisk = o => o.ardisik >= 2 || (o.oran !== null && o.oran < 80) || o.yok >= 3;

/* 📶 İnternetsiz yoklama: bağlantı yoksa yoklama telefonda saklanır, bağlantı gelince (ya da "Şimdi gönder") gönderilir */
/* Kuyruk telefonda (localStorage) ve bellekte tutulur: tarayıcı deposu kapalıysa (ör. Apps Script'teki eski link) en azından sayfa açıkken kaybolmaz */
let ykBellek = [];

const agHatasi = m => /İnternet bağlantısı yok|ulaşılamadı|Failed to fetch|NetworkError|Load failed/i.test(m || "");
async function ykGonder(ya){
  try {
    const v = await yukle(() => run("yoklamaKaydet", kim, ya));
    SB.veri = v; mesaj = v.mesaj || ""; SB.mod = "ozet"; SB.yk = null; SB.ykGerekce = "";

    mesaj = "📶 İnternet yok: yoklama bu telefonda saklandı. Bağlantı gelince kendiliğinden gönderilecek.";
    SB.mod = "ozet"; SB.yk = null; SB.ykGerekce = "";

let ykGidiyor = false;
async function ykKuyrukGonder(elle){
  const benim = x => kim && x.ad === kim.ad && (!x.kurum || !KURUM || x.kurum === KURUM.kod);
  if (ykGidiyor || !ykKuyruk().some(benim)) return;
  ykGidiyor = true;
  let gitti = 0, son = null;
  try {
    for (const x of ykKuyruk().filter(benim)) {
      try { son = await run("yoklamaKaydet", kim, x.a); gitti++; ykYaz(ykKuyruk().filter(y => y.zaman !== x.zaman)); }
      catch (e) {
        if (agHatasi(e.message)) { if (elle) alert("Hâlâ internet yok. Bağlantı gelince yeniden denenecek."); break; }
        ykYaz(ykKuyruk().filter(y => y.zaman !== x.zaman));
        alert("Bekleyen yoklama gönderilemedi (" + x.a.sube + " · " + x.a.ders + "): " + e.message);
      }
    }
  } finally { ykGidiyor = false; }
  if (gitti) {
    mesaj = "📶 " + gitti + " bekleyen yoklama gönderildi.";
    if (son && SB.secili === son.sube.id) SB.veri = son;
    if (kim && V) ciz();
  }
}

/* Konu seçici: dersin konu listesi, şubenin sınıfına göre süzülür ("Tüm sınıflar" ile hepsi) */
async function konuSecModal(ders, ops){

        const on = kal && kal.sinif === k.sinif && kal.unite === k.unite && kal.konu === k.konu && kal.alt === k.alt;
        const ok = isl.has([k.sinif, k.unite, k.konu, k.alt].join("|"));

  if (izin !== "granted") return alert("Bildirim izni verilmedi. İsterseniz telefonun Ayarlar → Bildirimler bölümünden Soru ve Ödev Takip'e izin verebilirsiniz.");
  mesgul(1);
  try {
    const t = await fcmToken();
    if (!t) throw new Error("Telefon bildirim anahtarı vermedi.");
    const r = await run("bildirimKaydet", kim, t, cihazAdi());
    ls.set("fcm", { ad: kim.ad, token: t, gun: bugunStr() });
    mesaj = r.gonderilebilir ? "🔔 Bildirimler açıldı. Deneme bildirimi gönderildi." : "🔔 Bildirimler açıldı (sunucu tarafı kurulunca gelmeye başlayacak).";
    if (r.gonderilebilir) run("bildirimDene", kim).catch(() => {});
    ciz();
  } catch (e) {
    alert(e.message === "IZIN_YOK" ? "Bildirim izni verilmedi. Telefonun Ayarlar → Uygulamalar → Soru ve Ödev Takip → Bildirimler bölümünden açabilirsiniz." : "Bildirimler açılamadı: " + e.message);
    if (e.message === "IZIN_YOK") ciz();
  }
  finally { mesgul(-1); }
}
